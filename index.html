.v3-intro h2,.v4-hero h2{font-family:'Playfair Display',serif;color:#674b56;font-size:25px;font-weight:600}
.v3-intro p,.v4-hero p{color:#866f79}
.v3-badge{color:var(--ui-primary-dark);border-color:#fff9}
.v3-toolbar{background:#fffcfa;border-color:var(--line);border-radius:16px}
.v3-panel{padding:18px}.v3-panel h3{color:#503d45;font-size:13px;font-weight:800}
.v3-panel label,.v3-toolbar label{color:#7e6c75}
.v3-subtabs{background:#f6f0ef}.v3-subtabs button{color:#887780}.v3-subtabs button.on{color:var(--ui-primary-dark)}
.v3-righttabs{border-bottom-color:#eee3e0}.v3-righttabs button{border-color:#e9dfdd;color:#8b7781}.v3-righttabs button.active{background:var(--ui-soft);border-color:#e2cfd1;color:var(--ui-primary-dark)}
.v3-scenes .v3-scene,.v3-template,.v3-asset,.v3-project,.v3-compare button{border-color:#ede1df;color:#685760}
.v3-scene.chosen,.v3-template.sel,.v3-template:hover,.v3-compare button.active{background:var(--ui-soft-2);border-color:var(--ui-primary);color:var(--ui-primary-dark);box-shadow:none}
.v3-variant.selected{border-color:var(--ui-primary);box-shadow:0 0 0 2px #b1879122}
.v3-pillrow button.sel{border-color:var(--ui-primary);background:var(--ui-soft);color:var(--ui-primary-dark)}
.v3-stagewrap{background:#f5f0ee;border-color:#ece1df;border-radius:19px}
.v3-stage{box-shadow:0 15px 35px #6e4d7030}
.v3-stagehint,.v3-panel .v3-help,.v3-panel small{color:#95858d}
.v3-uploadbtn{background:var(--ui-soft-2);border-color:#d5b5bd;color:var(--ui-primary-dark)}
.v3-palette button.sel{box-shadow:0 0 0 2px var(--ui-primary)}
.v3-range{accent-color:var(--ui-primary)}.v3-guide{background:var(--ui-soft-2);color:#775e69}
.v3-project{transition:transform .16s}.v3-project:hover{transform:translateY(-2px)}
.v3-globalnotice{background:#fdf6ed;border-color:#f3e4d5;color:#82664e}
/* V4–V7 module surfaces */
.v4-panel,.v5-panel,.v6-panel,.v7-panel{border-color:var(--line)}
.v7-theme-switch{background:linear-gradient(115deg,#f8f0ed,#fffaf7);border-color:#eadcda;border-radius:17px}
.v7-choices button{border-color:#e8d9d9;border-radius:10px;color:#755e69;background:#fff}
.v7-choices button:hover{border-color:#c9a5ae;background:#fffaf9}
.v7-choices button.chosen{border-color:var(--ui-primary);background:var(--ui-soft);color:var(--ui-primary-dark);box-shadow:0 0 0 1px #b1879122 inset}
.v7-media-card{transition:transform .16s}.v7-media-card:hover{transform:translateY(-2px)}
.v7-stock-btn{border-color:#e8dedd}.v7-stock-btn:hover{outline-color:var(--ui-primary)}
.v7-topic-category{background:var(--ui-soft);color:var(--ui-primary-dark)}
.v7-cta{background:var(--ui-primary);color:white}
.v7-preview-wrap{background:#fffdfa}
/* Parent discovery and profile pages: keep the same brand identity */
.parentpage{background:var(--bg)}
.parentcards .card,.parentpage .card{border-color:var(--line)}
/* Mobile navigation, layout and touch targets */
@media(max-width:1150px){.main{padding:29px 27px 75px}.topbar{padding:0 27px}}
@media(max-width:760px){
 .shell{display:block}.main{padding:24px 17px 98px}.topbar{display:none}
 .mobile-head{background:#fffcfa;border-bottom:1px solid var(--line);min-height:68px;padding:11px 16px}
 .mobile-head .brandmark{width:36px;height:36px;border-radius:12px;font-size:22px}
 .mobile-head .brand{gap:9px}.mobile-head .brand b{font-size:17px}
 .mobilebar{background:#fffcfa;border-top:1px solid var(--line)}
 .mobilebar button.active{color:var(--ui-primary-dark)}
 .h1{font-size:29px}.headrow{margin-bottom:21px}.headrow>.btn{width:100%}
 .hero{padding:22px 19px;min-height:175px}.herotext h2{font-size:24px}.heroart{width:80px;opacity:.6}.heroart .flower{font-size:68px}
 .card{padding:18px}.eventcard{padding:0}.metric{padding:17px;min-height:128px}
 .v3-intro h2,.v4-hero h2{font-size:22px}
}
@media(max-width:430px){.heroart{display:none}.h1{font-size:27px}.mode button{padding:8px 10px}.metricnum{font-size:26px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}

<div class="grid4">${[['calendar','violet','Ateliers à venir',ev.length,'Ta programmation'],['users','pink','Inscriptions',total,'Tous les ateliers'],['heart','mint','Familles connues',state.family.length,'Dans ton répertoire'],['mail','peach','Abonnées newsletter',subscribers(),'Avec leur accord']].map(([i,c,t,n,sub])=>`<div class="card metric"><div class="metrichead"><span>${t}</span><div class="roundicon ${c}">${ic(i)}</div></div><div><div class="metricnum">${n}</div><div class="metricnote">${sub}</div></div></div>`).join('')}</div>

<div class="split"><div><div class="sectionhead"><h2>Activité récente</h2><span class="fine">Dans ton espace de démo</span></div><div class="card list">${state.logs.slice(0,4).map(l=>`<div class="activity"><div class="roundicon">${ic(l.type)}</div><div><strong>${esc(l.text)}</strong><p>${esc(l.date)}</p></div></div>`).join('')}</div></div><div><div class="sectionhead"><h2>Ton parcours automatisé</h2></div><div class="card">${[['megaphone','Communication','Fais connaître tes ateliers'],['calendar','Inscription','Collecte les réservations'],['mail','Confirmation','Rassure les parents'],['star','Après l’atelier','Avis et satisfaction'],['heart','Fidélisation','Invite aux prochains rendez-vous']].map(([i,t,d])=>`<div class="mini-step"><div class="stepbadge">${ic(i,'s')}</div><div><b>${t}</b><p>${d}</p></div></div>`).join('')}<button class="btn secondary small full" style="margin-top:14px" data-nav="automations">Voir mes automatisations ${ic('arrow','s')}</button></div></div></div>`}

return `Objet : Un prochain atelier à découvrir 🌷\n\nBonjour,\n\nJe suis ravie de vous présenter mon prochain atelier « ${t} ».\n\n📅 ${d} à ${e?e.time:'10:00'}\n📍 ${p}\n💗 Tarif : ${price}\n\nSi ce moment vous tente, vous pouvez découvrir les détails et vous inscrire sur ma page Kidigital Connect.\n\nAu plaisir de vous retrouver,\nCamille`};

rule.days==7?'selected':''}>J-7</option><option value="10" ${state.rule.days==10?'selected':''}>J-10</option><option value="15" ${state.rule.days==15?'selected':''}>J-15</option></select></div><div class="field"><label>Si remplissage inférieur à</label><select data-rule="fill"><option value="40" ${state.rule.fill==40?'selected':''}>40 %</option><option value="50" ${state.rule.fill==50?'selected':''}>50 %</option><option value="70" ${state.rule.fill==70?'selected':''}>70 %</option><option value="90" ${state.rule.fill==90?'selected':''}>90 %</option></select></div></div><div class="upload-note">Mode sécurité : la relance est toujours créée comme brouillon, jamais publiée sans validation dans cette démo.</div></div></div><div class="card"><h2 style="font-size:16px;margin:0 0 14px">Parcours d'une inscription</h2>${[['0','Inscription','Une famille réserve un atelier'],['1','Tout de suite','Confirmation par email'],['2','48 h avant','Rappel de l’atelier'],['3','Après présence','Remerciement & demande d’avis'],['4','Plus tard','Invitation au prochain événement, si autorisée']].map(([num,t,d],i)=>`<div style="display:flex;gap:12px;align-items:start;padding:9px 0"><span style="height:32px;width:32px;flex-shrink:0;display:grid;place-items:center;background:${i===0?'#e9ddf8':'#f6f3fb'};border-radius:50%;font-weight:850;color:#8b72c9;font-size:11px">${num}</span><div><b style="font-size:11.7px">${t}</b><p class="fine" style="margin:5px 0">${d}</p></div></div>`).join('')}<div class="tinyline"></div><h3 style="font-size:13px">Journal des actions</h3>${state.logs.slice(0,6).map(l=>`<div class="logline"><span>${esc(l.text)}</span><small>${esc(l.date)}</small></div>`).join('')}</div></div>`}

function parseRGB(hex){let t=(hex||'#b4a3db').replace('#','');if(t.length===3)t=t.split('').map(v=>v+v).join('');return [parseInt(t.slice(0,2),16)||0,parseInt(t.slice(2,4),16)||0,parseInt(t.slice(4,6),16)||0]}
function rgba(hex,a){return 'rgba('+parseRGB(hex).join(',')+','+a+')'}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2))}
function textLines(ctx,text,maxWidth,max=3){let all=[];String(text||'').split(/\n/).forEach(line=>{let words=line.split(/\s+/),cur='';for(let word of words){let p=cur?cur+' '+word:word;if(ctx.measureText(p).width>maxWidth&&cur){all.push(cur);cur=word}else cur=p}if(cur)all.push(cur)});if(all.length>max){all=all.slice(0,max);let last=all[max-1];while(ctx.measureText(last+'…').width>maxWidth&&last.length>1)last=last.slice(0,-1);all[max-1]=last+'…'}return all}
function drawLines(ctx,txt,x,y,maxWidth,lineHeight,max=3){let ls=textLines(ctx,txt,maxWidth,max);ls.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return y+ls.length*lineHeight}
function loadImage(url){return new Promise(resolve=>{if(!url)return resolve(null);let img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=url})}
function containedPhoto(ctx,img,x,y,w,h,r){if(!img)return;ctx.save();rounded(ctx,x,y,w,h,r);ctx.clip();let scale=Math.max(w/img.width,h/img.height),iw=img.width*scale,ih=img.height*scale;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);ctx.restore()}
function drawPetal(ctx,x,y,scale,color,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=color;for(let i=0;i<5;i++){ctx.save();ctx.rotate(i*Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-35*scale,21*scale,43*scale,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.beginPath();ctx.arc(0,0,14*scale,0,Math.PI*2);ctx.fillStyle='#fff7e7';ctx.fill();ctx.restore()}

function leadCreate(offerId){showModal('Nouvelle demande 💌','Ajoute une demande d’accompagnement à ton suivi.',`<form id="createLead"><div class="field"><label>Nom et prénom *</label><input name="name" required placeholder="Ex. Clara Dupont"/></div><div class="field"><label>Email *</label><input name="email" type="email" required placeholder="clara@exemple.fr"/></div><div class="field"><label>Accompagnement</label><select name="offerId">${state.offers.map(o=>`<option value="${o.id}" ${o.id===offerId?'selected':''}>${esc(o.title)}</option>`).join('')}</select></div><div class="field"><label>Notes non sensibles</label><textarea name="note" placeholder="Informations pratiques utiles"></textarea></div><div class="modalfooter"><button type="submit" class="btn">Ajouter la demande</button></div></form>`)}
function familyCreate(){showModal('Ajouter une famille 🫶','Ajoute une personne à ton carnet de contacts.',`<form id="createFamily"><div class="field"><label>Nom et prénom *</label><input name="name" required/></div><div class="field"><label>Email *</label><input name="email" type="email" required /></div><div class="field"><label>Centre d'intérêt</label><select name="interest"><option>Massage bébé</option><option>Portage</option><option>Post-partum</option><option>Parentalité</option><option>Autre</option></select></div><label class="checkline"><input type="checkbox" name="newsletter"/> Cette personne a expressément accepté de recevoir ma newsletter.</label><div class="modalfooter"><button class="btn" type="submit">Ajouter ce contact</button></div></form>`)}
function detail(eid){let e=eventBy(eid);if(!e){toast('Atelier introuvable');return}let all=state.signups.filter(s=>s.eventId===eid);showModal(esc(e.title),'Inscriptions, liste d’attente et suivi',`<div class="grid3" style="gap:9px;margin-bottom:20px"><div class="tile" style="padding:12px"><strong>${activeCount(eid)}/${e.capacity}</strong><p style="margin:5px 0 0">Inscrites</p></div><div class="tile" style="padding:12px"><strong>${spots(e)}</strong><p style="margin:5px 0 0">Places libres</p></div><div class="tile" style="padding:12px"><strong>${waitingCount(eid)}</strong><p style="margin:5px 0 0">En attente</p></div></div><div class="labelrow">Participantes</div>${all.length?all.map(s=>`<div class="activity"><div class="roundicon">${ic(s.status==='waitlist'?'clock':'users','s')}</div><div style="flex:1;min-width:0"><strong>${esc(s.name)}</strong><p>${esc(s.email)} · ${s.status==='waitlist'?'En liste d’attente':'Inscription confirmée'}</p></div>${s.status==='confirmed'?`<button class="btn secondary tiny" data-action="mark-presence" data-id="${s.id}">${s.attended===true?'✓ Présente':'Marquer présente'}</button>`:`<span class="statustag gold">Attente</span>`}</div>`).join(''):'<p class="info-note">Personne n’est encore inscrit.</p>'}<div class="tinyline"></div><div class="notify">${ic('mail')}<div>Les confirmations et rappels sont consignés dans le journal de démonstration si les automatisations sont activées.</div></div><div class="modalfooter"><button class="btn secondary" data-action="share-event" data-id="${eid}">${ic('share','s')} Partager</button><button class="btn" data-action="boost" data-id="${eid}">${ic('megaphone','s')} Booster cet atelier</button></div>`)}
function book(eid){let e=eventBy(eid);if(!e)return;const waiting=spots(e)===0;showModal(waiting?'Rejoindre la liste d’attente 🌷':'Je réserve ma place 💗',`${esc(e.title)} · ${fmtDate(e.date)} à ${esc(e.time)}`,`<div class="featurecard" style="margin-top:0;margin-bottom:18px"><div class="between"><b>${money(e.price)}</b><span class="tag ${waiting?'orange':'mint'}">${waiting?'Atelier complet':'Inscription'}</span></div><p>${esc(e.place)}</p></div><form id="bookEvent"><input type="hidden" name="eventId" value="${esc(eid)}"/><div class="field"><label>Nom et prénom *</label><input name="name" required autocomplete="name" placeholder="Ex. Camille Martin"/></div><div class="field"><label>Adresse email *</label><input type="email" name="email" required autocomplete="email" placeholder="bonjour@exemple.fr"/></div><label class="checkline" style="margin-bottom:11px"><input type="checkbox" name="newsletter"/> J'accepte de recevoir par email les actualités et prochains événements de cette accompagnante. (Facultatif)</label><div class="info-note">Les emails pratiques liés à cette inscription sont indépendants de ce choix. Démo uniquement : aucune réservation ni paiement réel.</div><div class="modalfooter"><button type="button" class="btn secondary" data-action="close-modal">Annuler</button><button class="btn" type="submit">${waiting?'M’inscrire sur liste d’attente':'Confirmer mon inscription'} ${ic('arrow','s')}</button></div></form>`)}
function thankYou(e,waiting){showModal(waiting?'Vous êtes sur la liste d’attente 🌷':'Votre inscription est enregistrée ! 🎉',waiting?'Vous serez recontactée si une place se libère (simulation).':'Merci ! Voici le récapitulatif de votre inscription fictive.',`<div class="featurecard"><div style="font-size:38px">${e.emoji}</div><h3 style="margin:8px 0">${esc(e.title)}</h3><p style="margin:7px 0">${fmtDate(e.date)} à ${esc(e.time)} · ${esc(e.place)}</p><p style="margin:7px 0">${waiting?'Statut : liste d’attente':'Montant de l’atelier : '+money(e.price)}</p></div><div class="notify">${ic('mail')}<div>En situation réelle, un email de confirmation partirait automatiquement. Ici, l'action est enregistrée seulement dans l'espace professionnel.</div></div><div class="modalfooter"><button class="btn" data-action="close-modal">Continuer à découvrir ${ic('arrow','s')}</button></div>`)}
function newsletter(){const list=state.family.filter(f=>f.newsletter);const ev=upcoming().slice(0,3);let str=`Bonjour 🌷\n\nJe suis heureuse de vous retrouver avec les prochaines rencontres à partager autour de la parentalité.\n\n${ev.map(e=>`💕 ${e.title} — ${shortDate(e.date)} à ${e.time} (${e.place})`).join('\n')}\n\nVous souhaitez nous rejoindre ? Retrouvez les ateliers sur ma page Kidigital Connect.\n\nÀ très bientôt,\nCamille`;
showModal('Préparer ma newsletter 💌',`${list.length} abonné${list.length>1?'s':''} avec consentement`, `<form id="newsletterForm"><div class="field"><label>Objet *</label><input required name="subject" value="De jolis moments à partager ce mois-ci 🌸"/></div><div class="field"><label>Message</label><textarea required name="message" style="min-height:230px">${esc(str)}</textarea></div><div class="notify">${ic('lock')}<div>Destinataires : ${list.length} famille(s) abonnée(s) uniquement. L'envoi est <b>simulé</b> et sera consigné dans le journal de la démo.</div></div><div class="modalfooter"><button class="btn secondary" type="button" data-action="close-modal">Annuler</button><button class="btn" type="submit" ${list.length?'':'disabled'}>${ic('send','s')} Simuler l’envoi à ${list.length} abonnée(s)</button></div></form>`)}
function testAutomation(){let e=upcoming()[0]||state.events[0];showModal('Tester les automatisations ⚡','Voici ce que ferait Kidigital Connect après une inscription.',`<div class="card" style="padding:14px;box-shadow:none"><div class="taglabel">${ic('calendar','s')} Atelier de test</div><h3 style="margin:10px 0">${esc(e.title)}</h3><p class="fine">Les actions activées ci-dessous sont simulées, sans aucun envoi réel.</p>${automationDefs.map(([key,i,t])=>`<div class="mini-step"><div class="stepbadge">${ic(i,'s')}</div><div style="flex:1"><b>${t}</b></div><span class="statustag ${state.settings[key]?'':'grey'}">${state.settings[key]?'Activée':'Désactivée'}</span></div>`).join('')}</div><div class="modalfooter"><button class="btn" data-action="run-test">${ic('zap','s')} Simuler ce parcours</button></div>`)}
function more(){showModal('Explorer Kidigital Connect 🌷','Accède aux autres rubriques de l’espace professionnel.',`<div class="nav" style="gap:5px">${nav.map(([id,ico,label])=>`<button class="navbtn" data-nav="${id}">${ic(ico)}<span>${label}</span>${ic('arrow','s')}</button>`).join('')}<button class="navbtn" data-mode="parent">${ic('search')}<span>Vue parents</span>${ic('arrow','s')}</button><button class="navbtn" data-action="reset">${ic('refresh')}<span>Réinitialiser les données de démo</span></button></div>`)}
function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Texte copié 📋')).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){let ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy');toast('Texte copié 📋')}catch(e){toast('Copie indisponible sur ce navigateur')}ta.remove()}
function shareText(t){if(navigator.share){navigator.share({title:'Kidigital Connect',text:t}).catch(()=>{})}else copyText(t)}
function exportContacts(){let header=['Nom','Email','Intérêt','Source','Consentement newsletter'];let lines=[header,...state.family.map(f=>[f.name,f.email,f.interest||'',f.source,f.newsletter?'Oui':'Non'])].map(row=>row.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+lines],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kidigital-connect-familles-demo.csv';a.click();URL.revokeObjectURL(url);toast('Fichier CSV généré')}
function act(action,id){switch(action){case 'studio-download':downloadVisual();break;case 'studio-reset':studioReset();render();toast('Visuel réinitialisé');break;case 'studio-queue':scheduleModal();break;case 'studio-caption':commEvent=studioEvent;commChannel='instagram';editorDraft=marketingText(eventBy(studioEvent),'instagram');navigate('communication');break;case 'clear-photo':state.brand.photo='';save();render();toast('Photo retirée');break;case 'clear-logo':state.brand.logo='';save();render();toast('Logo retiré');break;case 'campaign-preview':campaignPreview(id);break;case 'campaign-delete':state.campaigns=state.campaigns.filter(c=>c.id!==id);save();closeModal();render();toast('Brouillon retiré');break;case 'meta-req':metaReq(id);break;case 'test-auto-relance':addAutorelance();break;case 'close-modal':closeModal();break;case 'create-event':eventCreate();break;case 'create-offer':offerCreate();break;case 'new-lead':leadCreate(id);break;case 'add-family':familyCreate();break;case 'detail':detail(id);break;case 'book':book(id);break;case 'boost':commEvent=id||state.events[0]?.id;studioEvent=commEvent;studioReset();closeModal();navigate('studio');break;case 'marketing':closeModal();navigate('communication');break;case 'newsletter':newsletter();break;case 'regenerate':editorDraft=marketingText(eventBy(commEvent),commChannel);render();toast('Nouvelle proposition préparée ✨');break;case 'copy-marketing':copyText(document.getElementById('marketingEditor')?.value||editorDraft);break;case 'share-marketing':shareText(document.getElementById('marketingEditor')?.value||editorDraft);break;case 'share-event':{let e=eventBy(id);shareText(`Découvrez mon atelier « ${e.title} » le ${fmtDate(e.date)} à ${e.time} · ${e.place}. ${money(e.price)}.`);break}case 'export':exportContacts();break;case 'test-automation':testAutomation();break;case 'run-test':{let n=0;for(let [key,,title] of automationDefs){if(state.settings[key]){addlog('zap','Simulation : '+title);n++}}closeModal();render();toast(n+' automatisation(s) simulée(s)');break}case 'toggle-lead':{let l=state.leads.find(x=>x.id===id);if(l){l.status=l.status==='Confirmé'?'Nouveau':'Confirmé';addlog('heart',`Accompagnement ${l.status.toLowerCase()} pour ${l.name}`);render()}break}case 'mark-presence':{let s=state.signups.find(x=>x.id===id);if(s){s.attended=!s.attended;if(s.attended&&state.settings.feedback)addlog('star',`Demande d’avis préparée pour ${s.name} (démo)`);save();let e=s.eventId;detail(e);toast(s.attended?'Présence enregistrée':'Présence retirée')}break}case 'reset':{if(confirm('Revenir aux données fictives de départ ? Tes ajouts de démonstration seront effacés.')){try{localStorage.removeItem('kidigital-connect-v1')}catch(e){}state=JSON.parse(JSON.stringify(defaults));state.brand={...brandDefaults};state.campaigns=[];state.social={facebook:false,instagram:false};state.rule={active:false,days:10,fill:70,approval:true};studioEvent='e1';studioIntent='places';studioReset();closeModal();mode='pro';page='dashboard';eventTab='upcoming';render();toast('Démo réinitialisée')}break}}
}
function handleForm(form){let d=Object.fromEntries(new FormData(form).entries());if(form.id==='schedulePostForm'){let ch=[...(d.instagram?['Instagram']:[]),...(d.facebook?['Facebook']:[])];if(!ch.length){toast('Choisis au moins un réseau');return;}draftCampaign({eventId:studioEvent,title:d.title,caption:d.caption,date:d.date,time:d.time,channels:ch,status:'Planifié · démo'});closeModal();navigate('publications');toast('Ajouté au calendrier de démonstration');return;}if(form.id==='createEvent'){let capacity=+d.capacity,price=+d.price;if(!d.title||!d.place||!d.date||capacity<1||!Number.isFinite(price)){toast('Vérifie les informations');return}let emojis={'Massage bébé':'🧸','Portage':'🤱','Post-partum':'🌸','Parentalité':'💜','Sommeil':'🌙','Autre':'🌷'};let colors={'Massage bébé':'pink','Portage':'peach','Post-partum':'sage','Parentalité':'blue','Sommeil':'blue','Autre':'pink'};let e={id:uid(),title:d.title.trim(),category:d.category,date:d.date,time:d.time,duration:d.duration||'1h30',place:d.place.trim(),capacity,price,emoji:emojis[d.category],color:colors[d.category],description:d.description||'Un temps de rencontre convivial pour les familles.'};state.events.push(e);addlog('calendar',`Nouvel atelier publié : ${e.title}`);commEvent=e.id;closeModal();navigate('ateliers');toast('Ton atelier est publié dans la démo 🌸')}else if(form.id==='createOffer'){state.offers.push({id:uid(),title:d.title,price:+d.price,description:d.description,emoji:'💗'});addlog('heart',`Accompagnement ajouté : ${d.title}`);closeModal();render();toast('Accompagnement ajouté')}else if(form.id==='createLead'){state.leads.push({id:uid(),name:d.name,email:d.email,offerId:d.offerId,status:'Nouveau',note:d.note||''});addlog('users',`Nouvelle demande : ${d.name}`);closeModal();render();toast('Demande ajoutée')}else if(form.id==='createFamily'){let email=d.email.toLowerCase().trim();if(state.family.some(f=>f.email===email)){toast('Cette adresse existe déjà dans les contacts');return}state.family.push({id:uid(),name:d.name.trim(),email,interest:d.interest,source:'Ajout manuel',newsletter:!!d.newsletter});addlog('users',`Contact ajouté : ${d.name}`);closeModal();render();toast('Famille ajoutée')}else if(form.id==='bookEvent'){let e=eventBy(d.eventId);if(!e)return;let email=d.email.toLowerCase().trim();if(state.signups.some(s=>s.eventId===e.id&&s.email===email)){toast('Cette adresse est déjà inscrite à cet atelier');return}let waiting=spots(e)===0;let status=waiting?'waitlist':'confirmed';state.signups.push({id:uid(),eventId:e.id,name:d.name.trim(),email,newsletter:!!d.newsletter,attended:null,status,source:'Kidigital'});let existing=state.family.find(f=>f.email===email);if(existing){if(d.newsletter)existing.newsletter=true;existing.interest=e.category}else state.family.push({id:uid(),name:d.name.trim(),email,newsletter:!!d.newsletter,source:'Kidigital',interest:e.category});addlog('users',`${d.name.trim()} : ${waiting?'liste d’attente':'inscription confirmée'} à « ${e.title} »`);if(!waiting&&state.settings.confirmation)addlog('mail',`Email de confirmation préparé pour ${d.name.trim()} (démo)`);if(d.newsletter)addlog('heart',`${d.name.trim()} a accepté la newsletter`);render();thankYou(e,waiting)}else if(form.id==='newsletterForm'){addlog('mail',`Newsletter « ${d.subject} » simulée pour ${subscribers()} abonnée(s)`);state.emailCount++;closeModal();render();toast('Simulation de newsletter enregistrée, aucun email envoyé 💌')}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-action],[data-nav],[data-mode],[data-tab],[data-comm],[data-filter]');if(t){if(t.dataset.action){act(t.dataset.action,t.dataset.id)}else if(t.dataset.nav){if(t.dataset.nav==='more')more();else if(t.dataset.nav==='parent')setMode('parent');else{mode='pro';closeModal();navigate(t.dataset.nav)}}else if(t.dataset.mode){closeModal();setMode(t.dataset.mode)}else if(t.dataset.tab){eventTab=t.dataset.tab;render()}else if(t.dataset.comm){editorDraft=document.getElementById('marketingEditor')?.value||editorDraft;commChannel=t.dataset.comm;editorDraft=marketingText(eventBy(commEvent),commChannel);render()}else if(t.dataset.filter){parentFilter=t.dataset.filter;render()}return}if(e.target.matches('[data-overlay]'))closeModal()});
document.addEventListener('submit',e=>{if(e.target.matches('form')){e.preventDefault();handleForm(e.target)}});
document.addEventListener('change',e=>{if(e.target.matches('[data-setting]')){state.settings[e.target.dataset.setting]=e.target.checked;addlog('zap',`${e.target.checked?'Activée':'Désactivée'} : ${automationDefs.find(x=>x[0]===e.target.dataset.setting)[2]}`);render();toast('Préférence enregistrée')}else if(e.target.id==='commEvent'){editorDraft='';commEvent=e.target.value;editorDraft=marketingText(eventBy(commEvent),commChannel);render()}});
document.addEventListener('input',e=>{if(e.target.id==='familySearch'){let pos=e.target.selectionStart;familyQuery=e.target.value;render();let n=document.getElementById('familySearch');n?.focus();n?.setSelectionRange(pos,pos)}else if(e.target.id==='parentSearch'){let pos=e.target.selectionStart;parentSearch=e.target.value;render();let n=document.getElementById('parentSearch');n?.focus();n?.setSelectionRange(pos,pos)}else if(e.target.id==='marketingEditor'){editorDraft=e.target.value}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

async function downloadVisual(){let canvas=document.getElementById('visualCanvas');if(!canvas)return;await drawVisual();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');let e=eventBy(studioEvent);a.download='kidigital-'+(e?.title||'atelier').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,45)+'-'+studioFormat+'.png';document.body.appendChild(a);a.click();a.remove();toast('Ton visuel PNG est prêt ✨')}
function loadCompressedImage(file,max=1300){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(Error('Sélectionne une image'));if(file.size>12_000_000)return reject(Error('Image trop volumineuse (12 Mo max)'));const rd=new FileReader();rd.onerror=()=>reject(Error('Lecture impossible'));rd.onload=()=>{let img=new Image();img.onload=()=>{let w=img.width,h=img.height,r=Math.min(1,max/Math.max(w,h));let c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(h*r);let ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=()=>reject(Error('Image invalide'));img.src=rd.result};rd.readAsDataURL(file)})}
document.addEventListener('click',ev=>{let st=ev.target.closest('[data-style]');if(st){studioStyle=st.dataset.style;render();return;}});
document.addEventListener('change',async ev=>{let x=ev.target;if(x.id==='studioEvent'){studioEvent=x.value;studioReset();render()}else if(x.id==='studioIntent'){studioIntent=x.value;studioReset();render()}else if(x.id==='studioFormat'){studioFormat=x.value;render()}else if(x.matches('[data-brand]')){state.brand[x.dataset.brand]=x.value;save();render();toast('Charte graphique enregistrée')}else if(x.matches('[data-rule]')){state.rule[x.dataset.rule]=Number(x.value);save();render();toast('Règle mise à jour')}else if(x.id==='brandPhoto'||x.id==='brandLogo'){if(!x.files?.[0])return;try{const data=await loadCompressedImage(x.files[0],x.id==='brandLogo'?450:1400);state.brand[x.id==='brandLogo'?'logo':'photo']=data;save();render();toast('Ton image a été ajoutée à ta marque')}catch(err){toast(err.message||'Impossible de lire cette image')}}});
document.addEventListener('input',ev=>{let x=ev.target;if(x.id==='studioTitle'){studioTitle=x.value;studioDirty=true;drawVisual()}else if(x.id==='studioLine'){studioLine=x.value;studioDirty=true;drawVisual()}else if(x.id==='studioBadge'){studioBadge=x.value;studioDirty=true;drawVisual()}});

function v3LayerSync(){const stage=document.getElementById('v3Stage');if(!stage)return;stage.querySelectorAll('[data-layer]').forEach(n=>{let l=v3.layers.find(x=>x.id===n.dataset.layer);if(!l)return;let family=l.font==='editorial'?'Georgia,serif':l.font==='modern'?'Arial,sans-serif':"'Trebuchet MS',sans-serif";n.textContent=l.text;n.style.left=l.x+'%';n.style.top=l.y+'%';n.style.fontSize=(l.size/7.2)+'cqw';n.style.color=l.color;n.style.width=l.kind==='pill'?'auto':l.width+'%';n.style.textAlign=l.align;n.style.fontFamily=family;n.style.setProperty('--pillcolor',l.pill||'#865db3');n.classList.toggle('selected',v3.selected===l.id)});}
async function v3Img(url){return new Promise((resolve,reject)=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Image inaccessible'));i.src=url})}
function v3Wrapped(ctx,text,maxW){let lines=[];for(let part of String(text||'').split('\n')){let arr=part.split(/\s+/),line='';for(let word of arr){let next=line?line+' '+word:word;if(ctx.measureText(next).width>maxW&&line){lines.push(line);line=word}else line=next}lines.push(line)}return lines}
async function v3ExportCanvas(thumb=false){let w=thumb?360:1080,h=(v3.format==='story'?1920:1080)*(w/1080);let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');let im=await v3Img(v3Photo());let scale=Math.max(w/im.width,h/im.height)*(v3.photoScale||1),dw=im.width*scale,dh=im.height*scale;ctx.drawImage(im,(w-dw)/2+w*(v3.photoX||0)/100,(h-dh)/2+h*(v3.photoY||0)/100,dw,dh);let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#16102433');grad.addColorStop(.28,'#0000');grad.addColorStop(.45,'#0000');grad.addColorStop(1,'#130e21b0');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
 const factor=w/720;
 ctx.textAlign='left';ctx.fillStyle='#ffffff';ctx.shadowColor='#00000055';ctx.shadowBlur=9*factor;ctx.font=`bold ${22*factor}px Arial,sans-serif`;ctx.fillText((state.brand.name||'Le Cocon de Camille').slice(0,40),w*.05,h*.049,w*.65);
 if(v3.showLogo&&state.brand.logo){try{let logo=await v3Img(state.brand.logo);ctx.drawImage(logo,w*(v3.logoX??82)/100,h*(v3.logoY??3)/100,w*(v3.logoScale??16)/100,w*(v3.logoScale??16)/100)}catch(e){}}
 for(let el of v3.layers){ctx.save();ctx.shadowColor='#130b1955';ctx.shadowBlur=5*factor;let family=el.font==='editorial'?'Georgia,serif':el.font==='modern'?'Arial,sans-serif':'Trebuchet MS,sans-serif';ctx.font=`${el.weight||700} ${el.size*factor}px ${family}`;ctx.textAlign=el.align||'center';ctx.textBaseline='middle';let x=w*el.x/100,y=h*el.y/100;let maxWidth=w*(el.width||85)/100;let lines=v3Wrapped(ctx,el.text,maxWidth);let lineHeight=el.size*factor*1.11,blockH=lines.length*lineHeight,startY=y-blockH/2+lineHeight/2;
 if(el.kind==='pill'){let target=lines[0]||' ',tw=ctx.measureText(target).width+50*factor,r=25*factor;ctx.fillStyle=el.pill||'#805faf';ctx.shadowBlur=3*factor;ctx.beginPath();ctx.roundRect(x-tw/2,y-(el.size*factor+28*factor)/2,tw,el.size*factor+28*factor,r);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=el.color;ctx.textAlign='center';ctx.fillText(target,x,y,tw-20*factor)}else{ctx.fillStyle=el.color;let anchor=el.align==='left'?x-maxWidth/2:el.align==='right'?x+maxWidth/2:x;for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],anchor,startY+i*lineHeight,maxWidth)}ctx.restore()}
 return c;
}
async function v3Download(){try{let can=await v3ExportCanvas();let e=v3Event(),a=document.createElement('a');a.download=`Kidigital-${e.title.replace(/[^a-z0-9àâéèêëîïôùûüç -]/gi,'').trim().replace(/\s+/g,'-')}-${v3.format}.png`;a.href=can.toDataURL('image/png');a.click();toast('Visuel PNG téléchargé ✨')}catch(e){console.error(e);toast('Impossible de créer le PNG')}}
async function v3Save(){if(v3Busy)return;v3Busy=true;try{let c=await v3ExportCanvas(true);let pr={title:v3.layers.find(x=>x.id==='title')?.text||v3Event().title,date:new Date().toLocaleDateString('fr-FR'),preview:c.toDataURL('image/jpeg',.73),data:JSON.stringify({eventId:v3.eventId,scene:v3.scene,mood:v3.mood,format:v3.format,goal:v3.goal,layers:v3.layers,customPhoto:v3.customPhoto,caption:v3.caption})};v3.projects.unshift(pr);v3.projects=v3.projects.slice(0,12);v3Store();render();toast('Création ajoutée à ta bibliothèque 🌷')}catch(e){console.error(e);toast('Impossible de sauvegarder le visuel')}finally{v3Busy=false}}
function v3Schedule(){let start=daysFromNow(1);showModal('Programmer ma communication 📅','Simulation : le contenu est enregistré dans le calendrier local, sans publication réelle.',`<form id="v3ScheduleForm"><div class="field"><label>Nom de la publication</label><input name="title" required value="${v3E(v3Event().title)} · ${v3E(v3Goals.find(x=>x[0]===v3.goal)?.[1]||'Atelier')}"></div><div class="field"><label>Réseaux à utiliser (démo)</label><div class="chipset"><label class="channel"><input type="checkbox" name="instagram" checked> Instagram professionnel</label><label class="channel"><input type="checkbox" name="facebook" checked> Page Facebook</label></div></div><div class="inputgrid"><div class="field"><label>Date</label><input type="date" name="date" min="${daysFromNow(0)}" value="${start}" required></div><div class="field"><label>Heure</label><input type="time" name="time" value="10:00" required></div></div><div class="field"><label>Légende à publier</label><textarea name="caption" rows="7">${v3E(v3.caption)}</textarea></div><p class="v3-schedulehint">⚠️ Aucun compte Meta n'est connecté et aucune publication n'est envoyée. Il s'agit uniquement de tester le parcours.</p><div class="modalfooter"><button type="button" class="btn secondary" data-action="close-modal">Annuler</button><button class="btn" type="submit">Ajouter au calendrier démo</button></div></form>`)}
async function v3ScheduleSave(form){let d=Object.fromEntries(new FormData(form));let channels=[...(d.instagram?['Instagram']:[]),...(d.facebook?['Facebook']:[])];if(!channels.length){toast('Sélectionne au moins un réseau');return}try{let c=await v3ExportCanvas(true);let preview=c.toDataURL('image/jpeg',.72);state.campaigns.unshift({id:uid(),date:d.date,time:d.time,title:d.title,channels,caption:d.caption,eventId:v3.eventId,status:'Programmé · démo',format:v3.format,style:'Studio V3',intent:v3.goal,visualTitle:v3.layers.find(x=>x.id==='title')?.text,preview});addlog('calendar',`Publication V3 programmée en démo : ${d.title}`);save();closeModal();navigate('publications');toast('Publication simulée ajoutée au calendrier 🌸')}catch(e){console.error(e);toast('Impossible de préparer cette publication')}}
function v3Compress(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('Utilise une image'));if(file.size>10e6)return reject(Error('Image trop volumineuse'));let reader=new FileReader();reader.onerror=()=>reject(Error('Lecture impossible'));reader.onload=()=>{let image=new Image();image.onload=()=>{let c=document.createElement('canvas');let scale=Math.min(1,1150/Math.max(image.width,image.height));c.width=Math.round(image.width*scale);c.height=Math.round(image.height*scale);c.getContext('2d').drawImage(image,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};image.onerror=()=>reject(Error('Fichier image invalide'));image.src=reader.result};reader.readAsDataURL(file)})}
function v3Action(k,val){if(k==='tab'){v3.tab=val;v3Rerender();return}if(k==='right'){v3.rightTab=val;v3Rerender();return}if(k==='scene'){v3SetScene(val);return}if(k==='variant'){v3Snapshot();v3.mood=+val;v3.customPhoto='';v3Rerender();return}if(k==='template'){v3ChangeGoal(val);return}if(k==='format'){v3Snapshot();v3.format=val;v3Rerender();return}if(k==='generate'){v3.customPhoto='';v3.tab='ia';v3Rerender();toast('4 illustrations de démonstration proposées ✨');return}if(k==='undo'){v3Undo();return}if(k==='redo'){v3Undo(true);return}if(k==='refresh'){v3Snapshot();v3.layers=v3LayersForGoal();v3.selected='title';v3Rerender();return}if(k==='clearphoto'){v3Snapshot();v3.customPhoto='';v3Rerender();return}if(k==='addtext'||k==='addpill'){v3Snapshot();let id=uid();v3.layers.push({id,kind:k==='addpill'?'pill':'text',text:k==='addpill'?'MON MESSAGE':'Votre texte ici',x:50,y:k==='addpill'?38:42,size:k==='addpill'?18:30,color:'#ffffff',weight:800,width:85,align:'center',font:'rounded',pill:state.brand.accent});v3.selected=id;v3.rightTab='elements';v3Rerender();return}if(k==='delete'){v3Snapshot();v3.layers=v3.layers.filter(l=>l.id!==v3.selected);v3.selected=v3.layers[0]?.id||'';v3Rerender();return}if(k==='duplicate'){let l=v3Layer();if(l){v3Snapshot();let id=uid();v3.layers.push({...l,id,x:Math.min(95,l.x+6),y:Math.min(95,l.y+6)});v3.selected=id;v3Rerender()}return}if(k==='regen-caption'){v3.caption=v3Caption();v3Rerender();toast('Nouvelle légende préparée ✨');return}if(k==='copy-caption'){copyText(v3.caption);return}if(k==='download'){v3Download();return}if(k==='save'){v3Save();return}if(k==='schedule'){v3Schedule();return}if(k==='load'){let p=v3.projects[+val];if(!p)return;v3Snapshot();try{let d=JSON.parse(p.data);Object.assign(v3,d);v3.selected='title';v3Rerender();toast('Création rechargée')}catch(e){toast('Projet inaccessible')}return}if(k==='deleteproject'){v3.projects.splice(+val,1);v3Rerender();toast('Création supprimée')} }

document.addEventListener('pointerdown',ev=>{let el=ev.target.closest('[data-layer]');if(!el||page!=='studioia')return;let stage=document.getElementById('v3Stage');if(!stage)return;let layer=v3.layers.find(x=>x.id===el.dataset.layer);if(!layer)return;v3.selected=layer.id;v3Snapshot();let r=stage.getBoundingClientRect();v3Pointer={id:layer.id,startX:ev.clientX,startY:ev.clientY,x:layer.x,y:layer.y,w:r.width,h:r.height};el.setPointerCapture?.(ev.pointerId);ev.preventDefault();stage.querySelectorAll('[data-layer]').forEach(n=>n.classList.toggle('selected',n.dataset.layer===layer.id));},true);

ooter"><button type="button" class="btn secondary" data-action="close-modal">Annuler</button><button class="btn" type="submit">${waiting?'Rejoindre la liste d’attente':'Confirmer mon inscription'}</button></div></form>`)};

function v7DrawAgenda(full=false){let can=document.getElementById('v7AgendaCanvas');if(!can){can=document.createElement('canvas')}let dims=v7AgendaFormat==='flyer'?[1240,1754]:v7AgendaFormat==='story'?[900,1600]:[1080,1080];let scale=full?1:Math.min(1,720/dims[0],900/dims[1]);can.width=Math.round(dims[0]*scale);can.height=Math.round(dims[1]*scale);let ctx=can.getContext('2d'),w=can.width,h=can.height,r=w/dims[0];ctx.scale(r,r);let W=dims[0],H=dims[1],p=W*.075, colors={rose:['#b18791','#f3e9e6','#684b55'],sauge:['#7d9a89','#e8f0e9','#385c49'],prune:['#816178','#f0e7ee','#4d3649']}[v7AgendaStyle],ev=v7MonthEvents().slice(0,8);ctx.fillStyle='#fffaf8';ctx.fillRect(0,0,W,H);ctx.fillStyle=colors[1];ctx.beginPath();ctx.arc(W*.95,H*.06,W*.27,0,7);ctx.fill();ctx.fillStyle=colors[0];ctx.fillRect(0,0,W,Math.max(18,H*.017));ctx.textBaseline='top';ctx.fillStyle=colors[2];ctx.font=`700 ${Math.round(W*.034)}px Georgia`;ctx.fillText((state.brand.name||'KIDIGITAL CONNECT').toUpperCase().slice(0,34),p,H*.075);ctx.font=`bold ${Math.round(W*.068)}px Georgia`;ctx.fillText(v7AgendaTitle.slice(0,32),p,H*.15);ctx.font=`${Math.round(W*.036)}px Arial`;ctx.fillText(v7MonthName().toUpperCase(),p,H*.235);ctx.fillStyle=colors[0];ctx.fillRect(p,H*.305,W-2*p,4);let top=H*.35,step=Math.min(H*.082,(H*.49)/Math.max(1,ev.length));if(!ev.length){ctx.fillStyle=colors[2];ctx.font=`${Math.round(W*.029)}px Arial`;ctx.fillText('Aucun atelier programmé pour ce mois.',p,top)}ev.forEach((e,i)=>{let y=top+i*step;ctx.fillStyle=colors[1];ctx.beginPath();ctx.roundRect(p,y,W-2*p,step*.83,16);ctx.fill();ctx.fillStyle=colors[2];ctx.font=`bold ${Math.round(W*.027)}px Arial`;let day=new Date(e.date+'T12:00:00');ctx.fillText(String(day.getDate()).padStart(2,'0')+'  '+e.time,p+22,y+15);ctx.font=`${Math.round(W*.025)}px Arial`;ctx.fillText(e.title.slice(0,45),p+W*.18,y+15);ctx.fillStyle=colors[0];ctx.font=`${Math.round(W*.018)}px Arial`;ctx.fillText((e.place||'').slice(0,42),p+W*.18,y+step*.48)});ctx.fillStyle=colors[2];c function v7EventLinks(e){showModal('Site & avis · '+esc(e.title),'Ajoute des liens qui apparaîtront dans la présentation de cet atelier.',`<form id="v7EventLinks"><input type="hidden" name="id" value="${esc(e.id)}"><div class="field"><label>Page de présentation de l’atelier (ou site)</label><input type="url" name="website" placeholder="https://..." value="${esc(e.website||state.profile.website||'')}"></div><div class="field"><label>Lien vers les avis Google</label><input type="url" name="google" placeholder="https://..." value="${esc(e.google||state.profile.google||'')}"></div><button class="btn" type="submit">Enregistrer les liens</button></form>`)}
const v7OldCard=eventCard;
eventCard=function(e,small){let h=v7OldCard(e,small);return h.replace(/(<\/article>)$/,`<div class="v7-event-footer"><button class="btn secondary tiny" data-v7="event-links" data-id="${esc(e.id)}">🌐 Site & avis Google</button></div>$1`)};
const v7OldParent=parent;
parent=function(){let h=v7OldParent();for(let e of state.events){let url=v7ValidUrl(e.website||state.profile.website),g=v7ValidUrl(e.google||state.profile.google);let needle=`<button class="btn" data-action="book" data-id="${e.id}"`;let buttons=`<div class="v7-parent-links">${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">En savoir plus sur l’atelier ↗</a>`:''}${g?`<a href="${esc(g)}" target="_blank" rel="noopener noreferrer">Avis Google ↗</a>`:''}</div>`;let i=h.indexOf(needle);if(i>=0)h=h.slice(0,i)+buttons+h.slice(i)}let end=h.lastIndexOf('</section>');return end>=0?h.slice(0,end)+v7ParentExtra()+h.slice(end):h+v7ParentExtra()};
const v7OldRender=render;
render=function(){v7ThemeApply();if(mode==='pro'&&['phototheque','agenda-visuel','profil','entraide'].includes(page)){renderChrome();document.getElementById('app').innerHTML=({phototheque:v7Phototheque,'agenda-visuel':v7Agenda,profil:v7Profile,entraide:v7Community}[page])();if(page==='agenda-visuel')v7DrawAgenda();return}v7OldRender();if(mode==='pro'&&page==='medias'){let h=document.querySelector('#app .headrow');if(h)h.insertAdjacentHTML('afterend',`<div class="notify" style="margin-bottom:18px">${ic('image')}<div>Besoin d’images prêtes à l’emploi ? <button class="btn secondary tiny" data-nav="phototheque">Découvrir la photothèque Kidigital</button></div></div>`)}if(mode==='pro'&&page==='studioia'){let panel=document.querySelector('.v3-panel');if(panel){let grid=v7MediaList().slice(0,12).map(m=>`<button type="button" class="v7-stock-btn" data-v7="use-stock" data-id="${esc(m.id)}" title="${esc(m.name)}"><img src="${esc(m.data)}" alt="${esc(m.name)}"></button>`).join('');panel.insertAdjacentHTML('beforeend',`<div class="v7-studio-library"><h4>Photothèque Kidigital</h4><p class="fine">Choisis une illustration partagée pour ton visuel.</p><div class="v7-studio-grid">${grid}</div><button class="btn secondary small full" data-nav="phototheque">Ouvrir la photothèque</button></div>`)}}if(mode==='pro'&&page==='marque'){let header=document.querySelector('#app .headrow');if(header)header.insertAdjacentHTML('afterend',`<div class="v7-theme-switch card"><div><strong>🎨 Tester l’interface en vieux rose</strong><p class="fine">Deux thèmes de démonstration. Les couleurs de ta marque restent indépendantes.</p></div><div class="v7-choices"><button data-v7="theme" data-val="rose" class="${state.v7Theme==='rose'?'chosen':''}"><i style="background:#b18791"></i> Vieux rose</button><button data-v7="theme" data-val="violet" class="${state.v7Theme==='violet'?'chosen':''}"><i style="background:#7964c3"></i> Lavande</button></div></div>`)}}
const v7OldV3Media=v3MediaPanel;
v3MediaPanel=function(){return v7OldV3Media()+`<div class="v7-studio-library"><h4>Photothèque Kidigital</h4><div class="v7-studio-grid">${v7MediaList().map(m=>`<button class="v7-stock-btn" data-v7="use-stock" data-id="${esc(m.id)}" title="${esc(m.name)}"><img src="${esc(m.data)}"></button>`).join('')}</div></div>`};
function v7AgendaCaption(){let ev=v7MonthEvents();let txt=`🌷 L’agenda de ${v7MonthName()} est arrivé !\n\n${ev.map(e=>`📅 ${shortDate(e.date)} · ${e.title} à ${e.time} (${e.place})`).join('\n')||'Les prochaines dates arrivent bientôt.'}\n\n✨ ${v7AgendaNote}\n\n👉 Pour réserver votre place, contactez-moi ou consultez mon site : ${state.profile.website||'[lien à ajouter]'}\n\n#atelierbebe #parentalite #agenda`;showModal('Légende pour mon agenda','Copie cette légende pour tes réseaux sociaux.',`<textarea id="v7CaptionText" rows="12" style="width:100%">${esc(txt)}</textarea><button class="btn" data-v7="copy-caption">📋 Copier la légende</button>`)}
async function v7AddStock(files){let category=document.getElementById('v7StockCategory')?.value||'Autre',license=document.getElementById('v7StockLicense')?.value||'Droits à vérifier';for(let file of [...files].slice(0,10)){try{let data=await loadCompressedImage(file,850);state.v7Stock.unshift({id:uid(),name:file.name.replace(/\.[^.]+$/,'').slice(0,65),data,category,license})}catch(e){toast('Image ignorée : '+file.name)}}state.v7Stock=state.v7Stock.slice(0,24);save();render();toast('Images ajoutées à la photothèque de démonstration')}
const v7OldHandleForm=handleForm;
handleForm=function(form){if(form.id==='v7ProfileForm'){let d=Object.fromEntries(new FormData(form));for(let k of ['first','last','job','city','email','website','google','bio'])state.profile[k]=(d[k]||'').trim();save();render();toast('Profil enregistré 🌸');return}if(form.id==='v7EventLinks'){let d=Object.fromEntries(new FormData(form)),e=eventBy(d.id);if(e){e.website=d.website.trim();e.google=d.google.trim();save()}closeModal();render();toast('Liens enregistrés');return}if(form.id==='v7TopicForm'){let d=Object.fromEntries(new FormData(form));state.v7Topics.unshift({id:uid(),title:d.title.trim(),category:d.category,body:d.body.trim(),author:state.profile.first+' · '+state.profile.job,date:'À l’instant',replies:[]});save();closeModal();navigate('entraide');toast('Discussion publiée dans cette démo');return}if(form.id==='v7ReplyForm'){let d=Object.fromEntries(new FormData(form)),t=state.v7Topics.find(x=>x.id===d.topicId);if(t){t.replies.push({name:state.profile.first,text:d.text.trim()});save();v7TopicOpen(t.id)}return}return v7OldHandleForm(form)};
document.addEventListener('click',ev=>{let b=ev.target.closest('[data-v7]');if(!b)return;ev.preventDefault();ev.stopImmediatePropagation();let k=b.dataset.v7,val=b.dataset.val,id=b.dataset.id;if(k==='theme'){state.v7Theme=val;save();render()}else if(k==='category'){v7Category=val;render()}else if(k==='use-stock'){let m=v7MediaList().find(x=>x.id===id);if(m){v3.customPhoto=m.data;v3.tab='photos';v3Store();navigate('studioia');toast('Image ajoutée au Studio ✨')}}else if(k==='remove-stock'){state.v7Stock=state.v7Stock.filter(x=>x.id!==id);save();render()}else if(k==='agenda-format'){v7AgendaFormat=val;render()}else if(k==='agenda-style'){v7AgendaStyle=val;render()}else if(k==='download-agenda'){let c=v7DrawAgenda(true),a=document.createElement('a');a.download='Kidigital-agenda-'+v7AgendaMonth+'-'+v7AgendaFormat+'.png';a.href=c.toDataURL('image/png');a.click();v7DrawAgenda();toast('Visuel PNG téléchargé')}else if(k==='agenda-caption')v7AgendaCaption();else if(k==='copy-caption'){let t=document.getElementById('v7CaptionText');if(t){copyText(t.value);toast('Légende copiée')}}else if(k==='topic-filter'){v7CommunityFilter=val;render()}else if(k==='new-topic')v7NewTopic();else if(k==='open-topic')v7TopicOpen(id);else if(k==='event-links'){let e=eventBy(id);if(e)v7EventLinks(e)}},true);
document.addEventListener('change',async ev=>{let t=ev.target;if(t.id==='v7StockUpload'){ev.stopImmediatePropagation();await v7AddStock(t.files)}else if(t.id==='v7ProfilePhoto'&&t.files?.[0]){ev.stopImmediatePropagation();try{state.profile.photo=await loadCompressedImage(t.files[0],550);save();toast('Portrait ajouté, enregistre le formulaire pour terminer')}catch(e){toast('Impossible de lire cette photo')}}else if(t.id==='v7Month'){v7AgendaMonth=t.value;render()}},true);
document.addEventListener('input',ev=>{let t=ev.target;if(t.id==='v7AgendaTitle'){v7AgendaTitle=t.value;v7DrawAgenda()}else if(t.id==='v7AgendaNote'){v7AgendaNote=t.value;v7DrawAgenda()}},true);
v7ThemeApply();

render();

// La démo reste en localStorage : nous personnalisons uniquement le prénom.
// Les ateliers/réservations ne sont PAS encore synchronisés avec Supabase.
async function naiteaRefreshAccount(supabase) {
  const { data, error } = await supabase.auth.getUser();
  const user = error ? null : data?.user;
  let fullName = '';
  if (user) {
    const { data: profile, error: profileError } = await supabase
      .from('naitea_profiles')
      .select('full_name')
      .eq('id', user.id)
      .maybeSingle();
    if (!profileError && profile?.full_name) fullName = profile.full_name;
    if (!fullName) fullName = user.user_metadata?.full_name || '';
  }
  const firstName = String(fullName).trim().split(/\s+/)[0] || '';
  naiteaAuthName = firstName.slice(0, 60);
  naiteaAuthEmail = user?.email || '';
  const accountLink = document.querySelector('.naitea-login-link');
  if (accountLink) accountLink.textContent = user ? '👤 Mon compte' : '🔐 Se connecter';
  const avatar = document.querySelector('.topbar .avatar');
  if (avatar) avatar.textContent = naiteaAuthName ? naiteaAuthName.charAt(0).toLocaleUpperCase('fr') : '♡';
  if (mode === 'pro' && page === 'dashboard') render();
}
async function naiteaLoadAuth() {
  try {
    const response = await fetch('/api/public-config', { cache: 'no-store' });
    if (!response.ok) return;
    const config = await response.json();
    if (!config.url || !config.publishableKey) return;
    const sdk = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    const supabase = sdk.createClient(config.url, config.publishableKey);
    await naiteaRefreshAccount(supabase);
    supabase.auth.onAuthStateChange(() => {
      setTimeout(() => { naiteaRefreshAccount(supabase).catch(() => {}); }, 0);
    });
  } catch (error) {
    console.warn('Naïtéa : identification indisponible en mode démo.');
  }
}
naiteaLoadAuth();
})();
