:root{
 --ui-primary:#b18791;--ui-primary-dark:#805965;--ui-soft:#f3e9e6;--ui-soft-2:#faf5f3;--ui-ink:#40343b;
 --ink:var(--ui-ink);--muted:#8a7d82;--paper:#fff;--bg:#f9f6f4;--line:#ebe3e0;
 --shadow:0 5px 24px rgba(72,47,55,.045),0 1px 3px rgba(72,47,55,.025);--radius:19px;
}
html{background:var(--bg)}body{background:var(--bg);color:var(--ui-ink);font-family:'DM Sans',sans-serif;font-size:14px;line-height:1.5;letter-spacing:-.005em}
::selection{background:#ead0d4;color:#523740}
button,input,select,textarea{font-family:'DM Sans',sans-serif}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--ui-primary);outline-offset:3px}
.shell{grid-template-columns:264px minmax(0,1fr)}

.navtitle{font-size:10px;letter-spacing:1.8px;color:#aa999e;padding:14px 16px 9px}
.nav{gap:3px}.navbtn{border-radius:11px;padding:11px 13px;font-size:12.5px;font-weight:700;color:#786c70;gap:12px;min-height:43px;transition:background .18s,color .18s,transform .18s}
.navbtn .icon{width:18px;height:18px;stroke-width:1.7}
.navbtn:hover{background:var(--ui-soft-2);color:var(--ui-primary-dark);transform:translateX(2px)}
.navbtn.active{background:var(--ui-soft);color:var(--ui-primary-dark);box-shadow:inset 3px 0 0 var(--ui-primary)}
.navbtn.active .icon{stroke-width:2.1}
.sidebottom{padding:10px 4px 0}.tipcard{border-radius:17px;background:linear-gradient(145deg,#f5e9e5,#fbf4f0);border:1px solid #efe0dd;padding:17px}
.tipcard:after{color:#dfbfc34b}.tipcard strong{color:#61424c;font-size:12px}.tipcard p{color:#8b777c;font-size:11px}
.tipcard button{color:var(--ui-primary-dark);border:1px solid #eadad8;border-radius:10px}
.topbar{height:77px;background:#fffcfa;border-bottom:1px solid var(--line);padding:0 43px}
.toplabel{font-size:12px;font-weight:600;color:#927c83;letter-spacing:.03em}
.mode{background:#f5efed;border:1px solid #eee4e1;border-radius:12px;padding:4px}
.mode button{color:#87747c;border-radius:9px;font-size:12px;font-weight:750;padding:9px 14px}
.mode button.selected{color:var(--ui-primary-dark);background:white;box-shadow:0 1px 6px #67454d12}
.avatar{background:var(--ui-soft);color:var(--ui-primary-dark);border:1px solid #ead8d8;border-radius:50%;width:39px;height:39px}
.main{max-width:1380px;padding:37px 44px 86px}
.eyebrow{font-size:10px;letter-spacing:2px;font-weight:850;color:var(--ui-primary-dark);text-transform:uppercase}
.h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;letter-spacing:-1.1px;font-size:clamp(29px,3vw,39px);line-height:1.17;color:#49353f;margin:8px 0 9px}
.subtitle{color:#8b7d83;font-size:13px;line-height:1.7}
.headrow{margin-bottom:27px;align-items:center}
.btn{background:var(--ui-primary);border-color:var(--ui-primary);color:white;border-radius:11px;min-height:40px;font-size:12px;font-weight:750;padding:11px 16px;box-shadow:none;transition:transform .17s,background .17s,border-color .17s,box-shadow .17s}
.btn:hover{background:var(--ui-primary-dark);border-color:var(--ui-primary-dark);box-shadow:0 5px 13px #9268751c;transform:translateY(-1px)}

.btn.small{min-height:34px}.btn.tiny{min-height:30px}
.card,.v3-panel,.v4-panel,.v5-panel,.v6-panel{border:1px solid var(--line);background:#fff;box-shadow:var(--shadow);border-radius:var(--radius)}
.card{padding:22px}.grid4,.grid3,.grid2{gap:16px}
.metric{padding:21px;gap:17px;min-height:152px;position:relative;overflow:hidden}
.metric:after{content:'';position:absolute;width:94px;height:94px;border-radius:50%;background:var(--ui-soft-2);right:-43px;bottom:-51px;pointer-events:none}
.metrichead{color:#84757b;font-size:11.5px}.metricnum{font-family:'Manrope',sans-serif;font-size:31px;font-weight:800;color:#493a42;letter-spacing:-1.5px}
.metricnote{color:#a29398}.roundicon{background:var(--ui-soft);color:var(--ui-primary-dark);border-radius:12px}
.roundicon.pink{background:#f8e7e9;color:#b16e83}.roundicon.mint{background:#eaf3ee;color:#688c79}.roundicon.peach{background:#fff0e4;color:#b98566}
.hero{background:linear-gradient(110deg,#f0dfdf 0%,#f8efea 57%,#fdf7f1 100%);border:1px solid #eadbd8;border-radius:23px;padding:29px 34px;min-height:209px;box-shadow:0 6px 20px #9d6e7c0a}
.hero::before{background:#fff7}.hero::after{background:#fff6}.herotext h2{font-family:'Playfair Display',serif;font-size:29px;font-weight:600;letter-spacing:-.6px;color:#62434f}
.herotext p{color:#846c75;font-size:12.5px}.heroart .flower{filter:drop-shadow(0 9px 11px #a8818840)}
.sectionhead{margin:29px 0 14px}.sectionhead h2{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;color:#4b3942;letter-spacing:-.35px}
.eventcard{padding:0;overflow:hidden;transition:transform .18s,box-shadow .18s}.eventcard:hover{transform:translateY(-2px);box-shadow:0 13px 30px #78505e13}
.eventillustration{height:148px;background:linear-gradient(135deg,#f4e1e5,#faf1ed)}

.eventcontent{padding:19px 21px 22px}.eventtitle{font-family:'Manrope',sans-serif;color:#483841;font-size:15px;line-height:1.4;font-weight:800}
.tag{background:var(--ui-soft);color:var(--ui-primary-dark);font-weight:800;letter-spacing:.015em;padding:6px 11px}
.tag.mint{background:#e8f2ea;color:#557966}.tag.orange{background:#fdf0e3;color:#ac7757}
.details,.fine{color:#94868c}.semibold{color:#57414b}
.progress{background:#f2ebeb}.progress>div{background:var(--ui-primary)}.progress.mint>div{background:#8bad9b}
.activity{border-bottom-color:#f2ebea}.activity strong{color:#4b3a43}.activity p{color:#a19298}
.mini-step .stepbadge{background:var(--ui-soft);color:var(--ui-primary-dark)}
.notify{background:var(--ui-soft-2);color:#785d67;border:1px solid #efdfdc;border-radius:13px}
.search,.field input,.field textarea,.field select,.v3-select,.v3-textfield,.v3-panel textarea{border-color:#e9dedd;border-radius:10px;background:#fff;color:#4e3b44}
.search:focus-within,.field input:focus,.field textarea:focus,.field select:focus,.v3-select:focus,.v3-textfield:focus{border-color:var(--ui-primary);box-shadow:0 0 0 3px #b1879122;outline:none}
.pilltabs{background:#f4eeec}.pilltabs button{color:#927f86}.pilltabs button.active{color:var(--ui-primary-dark);box-shadow:0 1px 6px #63444e0d}
.table th{color:#8a737d}.table td{border-color:#f0e9e7}

.v3-intro,.v4-hero{background:linear-gradient(115deg,#f0e1e0,#faf0ed 62%,#fdf7f1);border:1px solid #eadcd9;border-radius:21px}
.v3-intro h2,.v4-hero h2{font-family:'Playfair Display',serif;color:#674b56;font-size:25px;font-weight:600}

.v3-righttabs{border-bottom-color:#eee3e0}.v3-righttabs button{border-color:#e9dfdd;color:#8b7781}.v3-righttabs button.active{background:var(--ui-soft);border-color:#e2cfd1;color:var(--ui-primary-dark)}

function toast(message){document.getElementById('toastHost').innerHTML=`<div class="toast">${ic('check')}<span>${esc(message)}</span></div>`;clearTimeout(toast._t);toast._t=setTimeout(()=>document.getElementById('toastHost').innerHTML='',3500)}
function navigate(to){page=to;modalName='';render();window.scrollTo({top:0,behavior:'smooth'})}
function setMode(m){mode=m;if(m==='parent'){page='parent'}else{page='dashboard'}render();window.scrollTo(0,0)}
function naiteaNavigation(){
 const labels={dashboard:'Vue d’ensemble',studioia:'Studio IA',retouche:'Retouche photo',importsite:'Importer mon site',phototheque:'Photothèque',community:'Mon cercle'};
 const primary=['dashboard','ateliers','offers','familles'];
 const creation=['studioia','studio','retouche','medias','phototheque','publications','agenda-visuel'];
 const button=([id,icon,label])=>`<button class="navbtn ${page===id?'active':''}" data-nav="${id}" ${page===id?'aria-current="page"':''}>${ic(icon)}<span>${esc(labels[id]||label)}</span>${page===id?'<i class="nav-dot"></i>':''}</button>`;
 const group=(title,items)=>`<details class="navgroup" ${items.some(x=>x[0]===page)?'open':''}><summary>${title}<span>＋</span></summary><div class="nav">${items.map(button).join('')}</div></details>`;
 return `<nav aria-label="Navigation professionnelle"><div class="navtitle">MON ACTIVITÉ</div><div class="nav">${nav.filter(x=>primary.includes(x[0])).map(button).join('')}</div>${group('Créer & communiquer',nav.filter(x=>creation.includes(x[0])))}${group('Développer mon activité',nav.filter(x=>!primary.includes(x[0])&&!creation.includes(x[0])))}</nav>`;
}

document.getElementById('modeDesktop').innerHTML=modeHTML;document.getElementById('mobilehead').innerHTML=`<div class="brand naitea-brand"><img class="naitea-symbol" src="/assets/naitea-symbol.svg" alt="" width="52" height="45"><div class="naitea-brand-word"><b>Naïtéa<span class="naitea-dot">.</span></b><small>Grandir, bien entourés.</small></div></div><div class="mode">${modeHTML}</div>`;
let mobiles=mode==='parent'?[['parent','search','Découvrir'],['dashboard','home','Espace pro']]:[['dashboard','home','Accueil'],['ateliers','calendar','Ateliers'],['studioia','wand','Studio IA'],['familles','users','Familles'],['more','menu','Plus']];

function pagehead(kicker,title,subtitle,action=''){return `<div class="headrow"><h1 class="h1">${title}</h1>${action}</div>`}
function eventCard(e,small=false){let count=activeCount(e.id),pct=Math.min(100,Math.round(count/e.capacity*100));return `<article class="card eventcard"><div class="eventillustration ${e.color}">${v5Cover(e)}<span class="tag" style="position:absolute;right:15px;bottom:13px;z-index:1;background:#fffdfc">${spots(e)===0?'Complet':spots(e)+' places libres'}</span></div><div class="eventcontent"><span class="tag ${e.color==='sage'?'mint':''}">${esc(e.category)}</span><div class="eventtitle">${esc(e.title)}</div><div class="details"><span>${ic('calendar','s')}${shortDate(e.date)} · ${esc(e.time)}</span><span>${ic('pin','s')}${esc(e.place)}</span></div><div style="margin-top:18px"><div class="between"><span class="fine">${count} / ${e.capacity} inscrites</span><span class="fine semibold">${pct} % rempli</span></div><div class="progress ${e.color==='sage'?'mint':''}"><div style="width:${pct}%"></div></div></div><div class="eventactions"><button class="btn small" data-action="detail" data-id="${e.id}">${ic('users','s')} Inscriptions</button><button class="btn secondary small" data-action="v5-edit" data-id="${e.id}">${ic('edit','s')} Modifier</button></div><details class="event-more"><summary aria-label="Autres actions pour ${esc(e.title)}">Plus ${ic('chevron','s')}</summary><div class="event-more-actions"><button data-action="boost" data-id="${e.id}">${ic('megaphone','s')} Créer un visuel / Booster</button><button data-action="v5-share" data-id="${e.id}">${ic('share','s')} Partager / Intégrer</button><button data-v7="event-links" data-id="${e.id}">${ic('external','s')} Site & avis Google</button></div></details></div></article>`}
document.addEventListener('keydown',event=>{
 if(event.key!=='Escape')return;
 const expanded=event.target.closest('.event-more[open]')||document.querySelector('.event-more[open]');
 if(expanded){expanded.open=false;expanded.querySelector('summary').focus();}
});
function dashboard(){

 const stats=[['Ateliers à venir',events.length,'ateliers'],['Inscriptions',state.signups.filter(s=>s.status==='confirmed').length,'ateliers'],['Contacts',state.family.length,'familles'],['Abonnements newsletter',subscribers(),'familles']];
 return `${pagehead('','Vue d’ensemble','',`<button class="btn" data-action="create-event">${ic('plus','s')} Créer un atelier</button>`)}
 <p class="naitea-demo-warning" role="note">Démonstration. Données fictives enregistrées sur cet appareil.</p>
 <div class="grid4 dashboard-metrics">${stats.map(([label,value,to])=>`<button class="card metric" data-nav="${to}"><span class="metrichead">${label}</span><span class="metricnum">${value}</span></button>`).join('')}</div>
 <div class="dashboard-calendar"></div>
 <div class="dashboard-content"><section class="dashboard-program"><div class="sectionhead"><h2>Ateliers à venir</h2><button class="btn ghost small" data-nav="ateliers">Tous les ateliers ${ic('arrow','s')}</button></div><div class="events">${events.slice(0,2).map(e=>eventCard(e,true)).join('')||'<div class="card empty"><p>Aucun atelier à venir.</p><button class="btn" data-action="create-event">Créer un atelier</button></div>'}</div></section>

function parseRGB(hex){let t=(hex||'#b4a3db').replace('#','');if(t.length===3)t=t.split('').map(v=>v+v).join('');return [parseInt(t.slice(0,2),16)||0,parseInt(t.slice(2,4),16)||0,parseInt(t.slice(4,6),16)||0]}
function rgba(hex,a){return 'rgba('+parseRGB(hex).join(',')+','+a+')'}
function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2))}
function textLines(ctx,text,maxWidth,max=3){let all=[];String(text||'').split(/\n/).forEach(line=>{let words=line.split(/\s+/),cur='';for(let word of words){let p=cur?cur+' '+word:word;if(ctx.measureText(p).width>maxWidth&&cur){all.push(cur);cur=word}else cur=p}if(cur)all.push(cur)});if(all.length>max){all=all.slice(0,max);let last=all[max-1];while(ctx.measureText(last+'…').width>maxWidth&&last.length>1)last=last.slice(0,-1);all[max-1]=last+'…'}return all}
function drawLines(ctx,txt,x,y,maxWidth,lineHeight,max=3){let ls=textLines(ctx,txt,maxWidth,max);ls.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return y+ls.length*lineHeight}
function loadImage(url){return new Promise(resolve=>{if(!url)return resolve(null);let img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=url})}
function containedPhoto(ctx,img,x,y,w,h,r){if(!img)return;ctx.save();rounded(ctx,x,y,w,h,r);ctx.clip();let scale=Math.max(w/img.width,h/img.height),iw=img.width*scale,ih=img.height*scale;ctx.drawImage(img,x+(w-iw)/2,y+(h-ih)/2,iw,ih);ctx.restore()}
function drawPetal(ctx,x,y,scale,color,rot){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=color;for(let i=0;i<5;i++){ctx.save();ctx.rotate(i*Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-35*scale,21*scale,43*scale,0,0,Math.PI*2);ctx.fill();ctx.restore()}ctx.beginPath();ctx.arc(0,0,14*scale,0,Math.PI*2);ctx.fillStyle='#fff7e7';ctx.fill();ctx.restore()}
async function drawVisual(){let c=document.getElementById('visualCanvas');if(!c||page!=='studio')return;let W=1080,H=studioFormat==='story'?1920:1080;c.width=W;c.height=H;let ctx=c.getContext('2d'),b=state.brand,e=eventBy(studioEvent)||state.events[0];if(!e)return;let primary=b.accent,second=b.secondary,dark=b.text,story=H>1100,vertical=story?1.55:1;
ctx.clearRect(0,0,W,H);let gradient=ctx.createLinearGradient(0,0,W,H);gradient.addColorStop(0,studioStyle==='cocon'?'#fafaf4':'#fffafc');gradient.addColorStop(1,rgba(second,.9));ctx.fillStyle=gradient;ctx.fillRect(0,0,W,H);
if(studioStyle==='petales'){ctx.fillStyle=rgba(primary,.18);ctx.beginPath();ctx.ellipse(1000,105,310,250,.4,0,Math.PI*2);ctx.fill();ctx.fillStyle=rgba(second,.75);ctx.beginPath();ctx.ellipse(55,H-90,340,280,-.5,0,Math.PI*2);ctx.fill();drawPetal(ctx,910,H*.86,2.2,rgba(primary,.37),.5);drawPetal(ctx,170,155,1.15,rgba(primary,.19),.2)}
if(studioStyle==='cocon'){ctx.fillStyle=rgba(primary,.12);ctx.beginPath();ctx.ellipse(960,150,330,400,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=rgba(second,.54);rounded(ctx,48,48,W-96,H-96,65);ctx.fill()}
if(studioStyle==='editorial'){ctx.fillStyle=primary;ctx.fillRect(0,0,24,H);ctx.fillStyle=rgba(primary,.14);ctx.fillRect(70,H-245,W-140,3)}
let pad=94,photo=await loadImage(b.photo);if(!document.getElementById('visualCanvas')||page!=='studio'||studioFormat!==(story?'story':'square'))return;
const font=b.font==='elegant'?`Georgia,serif`:b.font==='modern'?`Arial,sans-serif`:`'Trebuchet MS',Arial,sans-serif`;
ctx.textBaseline='top';ctx.fillStyle=dark;ctx.font=`700 45px ${font}`;ctx.fillText((b.name||'Le Cocon de Camille').slice(0,32),pad,story?93:65,W-pad*2);
ctx.fillStyle=rgba(dark,.7);ctx.font=`600 29px ${font}`;ctx.fillText('ATELIER PÉRINATALITÉ & PARENTALITÉ',pad,story?175:127,W-pad*2);
let photoY=story?305:228,photoH=story?740:405;
if(photo){containedPhoto(ctx,photo,pad,photoY,W-pad*2,photoH,story?75:59)}else{
 ctx.save();rounded(ctx,pad,photoY,W-pad*2,photoH,story?75:59);ctx.clip();let g=ctx.createLinearGradient(pad,photoY,W-pad,photoY+photoH);g.addColorStop(0,rgba(primary,.35));g.addColorStop(1,rgba(second,.9));ctx.fillStyle=g;ctx.fillRect(pad,photoY,W-pad*2,photoH);ctx.fillStyle='#ffffff50';ctx.beginPath();ctx.ellipse(W*.64,photoY+photoH*.52,280,290,-.15,0,Math.PI*2);ctx.fill();drawPetal(ctx,W*.5,photoY+photoH*.55,4.2,rgba(primary,.67),.4);ctx.restore()}
let mainY=story?1120:680;
ctx.font=`850 ${story?83:72}px ${font}`;ctx.fillStyle=dark;let ttl=studioTitle||e.title;mainY=drawLines(ctx,ttl,pad,mainY,W-pad*2,story?104:88,3);
ctx.font=`500 ${story?39:32}px ${font}`;ctx.fillStyle=rgba(dark,.85);mainY=drawLines(ctx,studioLine||`${shortDate(e.date)} · ${e.place}`,pad,mainY+(story?24:7),W-pad*2,story?51:39,story?3:2);
let badgeText=(studioBadge||'PLACES DISPONIBLES').toUpperCase(),by=story?H-225:H-105;
ctx.fillStyle=primary;rounded(ctx,pad,by-35,W-pad*2,93,47);ctx.fill();ctx.fillStyle='#ffffff';ctx.textBaseline='middle';ctx.textAlign='center';ctx.font=`800 ${story?34:32}px ${font}`;ctx.fillText(badgeText.slice(0,48),W/2,by+13,W-pad*2-55);ctx.textAlign='left';ctx.textBaseline='top';
let logo=await loadImage(b.logo);if(logo){ctx.save();ctx.globalAlpha=.95;containedPhoto(ctx,logo,W-210,story?85:52,114,90,15);ctx.restore()}
}
function scheduleModal(){let e=eventBy(studioEvent)||state.events[0];let now=new Date();now.setDate(now.getDate()+2);let date=now.toISOString().slice(0,10),text=v8Marketing(e,'instagram');showModal('Programmer une publication 📆','Validation et programmation simulées dans ce prototype.',`<form id="schedulePostForm"><div class="field"><label>Publication</label><input name="title" required value="${esc(e.title)} · ${intentLabel()}"/></div><div class="field"><label>Légende Instagram / Facebook</label><textarea name="caption" rows="6" required>${esc(text)}</textarea></div><div class="field"><label>Réseaux visés (démonstration)</label><div class="chipset"><label class="channel"><input name="instagram" type="checkbox" checked/> Instagram professionnel</label><label class="channel"><input name="facebook" type="checkbox" checked/> Page Facebook</label></div></div><div class="inputgrid"><div class="field"><label>Date prévue</label><input type="date" name="date" min="${daysFromNow(0)}" value="${date}" required/></div><div class="field"><label>Heure</label><input type="time" name="time" value="10:00" required/></div></div><div class="demowarning">⚠️ Aucune connexion Meta n'est active. L'élément sera enregistré dans le calendrier de simulation, mais ne sera jamais envoyé sur Instagram ou Facebook.</div><div class="modalfooter"><button class="btn secondary" data-action="close-modal" type="button">Annuler</button><button class="btn" type="submit">Enregistrer au calendrier de démo</button></div></form>`)}
function snapshotVisual(){let c=document.getElementById('visualCanvas');if(!c)return '';let out=document.createElement('canvas');out.width=270;out.height=Math.round(270*c.height/c.width);out.getContext('2d').drawImage(c,0,0,out.width,out.height);return out.toDataURL('image/jpeg',.68)}
function draftCampaign({date='',time='',title='',channels=['Instagram','Facebook'],caption='',eventId='',status='Brouillon · démo'}={}){let obj={id:uid(),date,time,title,channels,caption,eventId,status,format:studioFormat,style:studioStyle,intent:studioIntent,visualTitle:studioTitle,preview:snapshotVisual()};state.campaigns.unshift(obj);addlog('calendar',`Publication de démonstration créée : ${obj.title}`);return obj}

function reseaux(){return `${pagehead('Comptes sociaux','Mes réseaux sociaux 🔗','Prépare la connexion à tes comptes professionnels, sans accès réel pendant cette démo.') }<div class="grid2">${[['📸','Instagram professionnel','Compte Business ou Creator et autorisations de publication','instagram'],['📘','Page Facebook','Page que tu es autorisée à gérer et autorisations Meta','facebook']].map(([emo,name,desc,key])=>`<div class="card"><div class="between"><div style="font-size:38px">${emo}</div><span class="statustag grey">Non connecté</span></div><h2 style="font-size:18px;margin:15px 0 6px">${name}</h2><p class="subtitle">${desc}</p><div class="visual-actions"><button class="btn secondary full" data-action="meta-req" data-id="${key}">${ic('lock','s')} Voir les prérequis</button></div></div>`).join('')}</div><div class="notify" style="margin-top:19px">${ic('lock')}<div>La connexion réelle nécessite OAuth Meta, une application configurée et les permissions approuvées. Cette maquette n'accède à aucun compte et ne publie rien. Les comptes Instagram personnels ne sont pas pris en charge par l'API de publication professionnelle.</div></div><div class="sectionhead"><h2>Une fois la connexion réalisée…</h2></div><div class="flowsteps"><span class="flowdot">Visuel validé</span><span class="arrow">→</span><span class="flowdot">Choix du réseau</span><span class="arrow">→</span><span class="flowdot">Date programmée</span><span class="arrow">→</span><span class="flowdot">Publication & suivi</span></div>`}

function addAutorelance(){let matches=upcoming().filter(e=>{let diff=Math.ceil((new Date(e.date+'T12:00:00')-new Date())/86400000);return diff<=Number(state.rule.days)&&diff>=0&&activeCount(e.id)/e.capacity*100<Number(state.rule.fill)&&spots(e)>0});if(!matches.length){toast('Aucun atelier ne remplit cette règle aujourd’hui');return}let a=matches[0];let old=studioEvent;studioEvent=a.id;studioIntent='derniere';studioReset();draftCampaign({eventId:a.id,title:'Relance automatique proposée · '+a.title,channels:['Instagram','Facebook'],caption:v8Marketing(a,'instagram'),status:'À valider · démo'});studioEvent=old;addlog('zap','Relance proposée pour '+a.title);navigate('publications');toast('Relance brouillon prête à valider ✨')}

function copyText(t){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>toast('Texte copié 📋')).catch(()=>fallbackCopy(t))}else fallbackCopy(t)}
function fallbackCopy(t){let ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();try{document.execCommand('copy');toast('Texte copié 📋')}catch(e){toast('Copie indisponible sur ce navigateur')}ta.remove()}
function shareText(t){if(navigator.share){navigator.share({title:'Naïtéa',text:t}).catch(()=>{})}else copyText(t)}
function exportContacts(){let header=['Nom','Email','Intérêt','Source','Consentement newsletter'];let lines=[header,...state.family.map(f=>[f.name,f.email,f.interest||'',f.source,f.newsletter?'Oui':'Non'])].map(row=>row.map(v=>'"'+String(v||'').replaceAll('"','""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+lines],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='naitea-familles-demo.csv';a.click();URL.revokeObjectURL(url);toast('Fichier CSV généré')}
function act(action,id){switch(action){case 'studio-download':downloadVisual();break;case 'studio-reset':studioReset();render();toast('Visuel réinitialisé');break;case 'studio-queue':scheduleModal();break;case 'studio-caption':commEvent=studioEvent;commChannel='instagram';editorDraft=v8Marketing(eventBy(studioEvent),'instagram');navigate('communication');break;case 'clear-photo':state.brand.photo='';save();render();toast('Photo retirée');break;case 'clear-logo':state.brand.logo='';save();render();toast('Logo retiré');break;case 'campaign-preview':campaignPreview(id);break;case 'campaign-delete':state.campaigns=state.campaigns.filter(c=>c.id!==id);save();closeModal();render();toast('Brouillon retiré');break;case 'meta-req':metaReq(id);break;case 'test-auto-relance':addAutorelance();break;case 'close-modal':closeModal();break;case 'create-event':eventCreate();break;case 'create-offer':offerCreate();break;case 'new-lead':leadCreate(id);break;case 'add-family':familyCreate();break;case 'detail':detail(id);break;case 'book':book(id);break;case 'boost':commEvent=id||state.events[0]?.id;studioEvent=commEvent;studioReset();closeModal();navigate('studio');break;case 'marketing':closeModal();navigate('communication');break;case 'newsletter':newsletter();break;case 'regenerate':editorDraft=v8Marketing(eventBy(commEvent),commChannel);render();toast('Nouvelle proposition préparée ✨');break;case 'copy-marketing':copyText(document.getElementById('marketingEditor')?.value||editorDraft);break;case 'share-marketing':shareText(document.getElementById('marketingEditor')?.value||editorDraft);break;case 'share-event':{let e=eventBy(id);shareText(`Découvrez mon atelier « ${e.title} » le ${fmtDate(e.date)} à ${e.time} · ${e.place}. ${money(e.price)}.`);break}case 'export':exportContacts();break;case 'test-automation':testAutomation();break;case 'run-test':{let n=0;for(let [key,,title] of automationDefs){if(state.settings[key]){addlog('zap','Simulation : '+title);n++}}closeModal();render();toast(n+' automatisation(s) simulée(s)');break}case 'toggle-lead':{let l=state.leads.find(x=>x.id===id);if(l){l.status=l.status==='Confirmé'?'Nouveau':'Confirmé';addlog('heart',`Accompagnement ${l.status.toLowerCase()} pour ${l.name}`);render()}break}case 'mark-presence':{let s=state.signups.find(x=>x.id===id);if(s){s.attended=!s.attended;if(s.attended&&state.settings.feedback)addlog('star',`Demande d’avis préparée pour ${s.name} (démo)`);save();let e=s.eventId;detail(e);toast(s.attended?'Présence enregistrée':'Présence retirée')}break}case 'reset':{if(confirm('Revenir aux données fictives de départ ? Tes ajouts de démonstration seront effacés.')){try{localStorage.removeItem('kidigital-connect-v1')}catch(e){}state=JSON.parse(JSON.stringify(defaults));state.brand={...brandDefaults};state.campaigns=[];state.social={facebook:false,instagram:false};state.rule={active:false,days:10,fill:70,approval:true};studioEvent='e1';studioIntent='places';studioReset();closeModal();mode='pro';page='dashboard';eventTab='upcoming';render();toast('Démo réinitialisée')}break}}
}
function handleForm(form){let d=Object.fromEntries(new FormData(form).entries());if(form.id==='schedulePostForm'){let ch=[...(d.instagram?['Instagram']:[]),...(d.facebook?['Facebook']:[])];if(!ch.length){toast('Choisis au moins un réseau');return;}draftCampaign({eventId:studioEvent,title:d.title,caption:d.caption,date:d.date,time:d.time,channels:ch,status:'Planifié · démo'});closeModal();navigate('publications');toast('Ajouté au calendrier de démonstration');return;}if(form.id==='createEvent'){let capacity=+d.capacity,price=+d.price;if(!d.title||!d.place||!d.date||capacity<1||!Number.isFinite(price)){toast('Vérifie les informations');return}let emojis={'Massage bébé':'🧸','Portage':'🤱','Post-partum':'🌸','Parentalité':'💜','Sommeil':'🌙','Autre':'🌷'};let colors={'Massage bébé':'pink','Portage':'peach','Post-partum':'sage','Parentalité':'blue','Sommeil':'blue','Autre':'pink'};let e={id:uid(),title:d.title.trim(),category:d.category,date:d.date,time:d.time,duration:d.duration||'1h30',place:d.place.trim(),capacity,price,emoji:emojis[d.category],color:colors[d.category],description:d.description||'Un temps de rencontre convivial pour les familles.'};state.events.push(e);addlog('calendar',`Nouvel atelier publié : ${e.title}`);commEvent=e.id;closeModal();navigate('ateliers');toast('Ton atelier est publié dans la démo 🌸')}else if(form.id==='createOffer'){state.offers.push({id:uid(),title:d.title,price:+d.price,description:d.description,emoji:'💗'});addlog('heart',`Accompagnement ajouté : ${d.title}`);closeModal();render();toast('Accompagnement ajouté')}else if(form.id==='createLead'){state.leads.push({id:uid(),name:d.name,email:d.email,offerId:d.offerId,status:'Nouveau',note:d.note||''});addlog('users',`Nouvelle demande : ${d.name}`);closeModal();render();toast('Demande ajoutée')}else if(form.id==='createFamily'){let email=d.email.toLowerCase().trim();if(state.family.some(f=>f.email===email)){toast('Cette adresse existe déjà dans les contacts');return}state.family.push({id:uid(),name:d.name.trim(),email,interest:d.interest,source:'Ajout manuel',newsletter:!!d.newsletter});addlog('users',`Contact ajouté : ${d.name}`);closeModal();render();toast('Famille ajoutée')}else if(form.id==='bookEvent'){let e=eventBy(d.eventId);if(!e)return;let email=d.email.toLowerCase().trim();if(state.signups.some(s=>s.eventId===e.id&&s.email===email)){toast('Cette adresse est déjà inscrite à cet atelier');return}let waiting=spots(e)===0;let status=waiting?'waitlist':'confirmed';state.signups.push({id:uid(),eventId:e.id,name:d.name.trim(),email,newsletter:!!d.newsletter,attended:null,status,source:'Naïtéa'});let existing=state.family.find(f=>f.email===email);if(existing){if(d.newsletter)existing.newsletter=true;existing.interest=e.category}else state.family.push({id:uid(),name:d.name.trim(),email,newsletter:!!d.newsletter,source:'Naïtéa',interest:e.category});addlog('users',`${d.name.trim()} : ${waiting?'liste d’attente':'inscription confirmée'} à « ${e.title} »`);if(!waiting&&state.settings.confirmation)addlog('mail',`Email de confirmation préparé pour ${d.name.trim()} (démo)`);if(d.newsletter)addlog('heart',`${d.name.trim()} a accepté la newsletter`);render();thankYou(e,waiting)}else if(form.id==='newsletterForm'){addlog('mail',`Newsletter « ${d.subject} » simulée pour ${subscribers()} abonnée(s)`);state.emailCount++;closeModal();render();toast('Simulation de newsletter enregistrée, aucun email envoyé 💌')}
}

async function downloadVisual(){let canvas=document.getElementById('visualCanvas');if(!canvas)return;await drawVisual();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');let e=eventBy(studioEvent);a.download='naitea-'+(e?.title||'atelier').toLocaleLowerCase('fr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').slice(0,45)+'-'+studioFormat+'.png';document.body.appendChild(a);a.click();a.remove();toast('Ton visuel PNG est prêt ✨')}
function loadCompressedImage(file,max=1300){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(Error('Sélectionne une image'));if(file.size>12_000_000)return reject(Error('Image trop volumineuse (12 Mo max)'));const rd=new FileReader();rd.onerror=()=>reject(Error('Lecture impossible'));rd.onload=()=>{let img=new Image();img.onload=()=>{let w=img.width,h=img.height,r=Math.min(1,max/Math.max(w,h));let c=document.createElement('canvas');c.width=Math.round(w*r);c.height=Math.round(h*r);let ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL(file.type==='image/png'||file.type==='image/webp'?'image/png':'image/jpeg',.88))};img.onerror=()=>reject(Error('Image invalide'));img.src=rd.result};rd.readAsDataURL(file)})}

async function v3Img(url){return new Promise((resolve,reject)=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=()=>reject(Error('Image inaccessible'));i.src=url})}
function v3Wrapped(ctx,text,maxW){let lines=[];for(let part of String(text||'').split('\n')){let arr=part.split(/\s+/),line='';for(let word of arr){let next=line?line+' '+word:word;if(ctx.measureText(next).width>maxW&&line){lines.push(line);line=word}else line=next}lines.push(line)}return lines}
async function v3ExportCanvas(thumb=false){let w=thumb?360:1080,h=(v3.format==='story'?1920:1080)*(w/1080);let c=document.createElement('canvas');c.width=w;c.height=h;let ctx=c.getContext('2d');let im=await v3Img(v3Photo());let scale=Math.max(w/im.width,h/im.height)*(v3.photoScale||1),dw=im.width*scale,dh=im.height*scale;ctx.drawImage(im,(w-dw)/2+w*(v3.photoX||0)/100,(h-dh)/2+h*(v3.photoY||0)/100,dw,dh);let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#16102433');grad.addColorStop(.28,'#0000');grad.addColorStop(.45,'#0000');grad.addColorStop(1,'#130e21b0');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
 const factor=w/720;
 ctx.textAlign='left';ctx.fillStyle='#ffffff';ctx.shadowColor='#00000055';ctx.shadowBlur=9*factor;ctx.font=`bold ${22*factor}px Arial,sans-serif`;ctx.fillText((state.brand.name||'Le Cocon de Camille').slice(0,40),w*.05,h*.049,w*.65);
 if(v3.showLogo&&state.brand.logo){try{let logo=await v3Img(state.brand.logo);ctx.drawImage(logo,w*(v3.logoX??82)/100,h*(v3.logoY??3)/100,w*(v3.logoScale??16)/100,w*(v3.logoScale??16)/100)}catch(e){}}
 for(let el of v3.layers){ctx.save();ctx.shadowColor='#130b1955';ctx.shadowBlur=5*factor;let family=el.font==='editorial'?'Georgia,serif':el.font==='modern'?'Arial,sans-serif':'Trebuchet MS,sans-serif';ctx.font=`${el.weight||700} ${el.size*factor}px ${family}`;ctx.textAlign=el.align||'center';ctx.textBaseline='middle';let x=w*el.x/100,y=h*el.y/100;let maxWidth=w*(el.width||85)/100;let lines=v3Wrapped(ctx,el.text,maxWidth);let lineHeight=el.size*factor*1.11,blockH=lines.length*lineHeight,startY=y-blockH/2+lineHeight/2;
 if(el.kind==='pill'){let target=lines[0]||' ',tw=ctx.measureText(target).width+50*factor,r=25*factor;ctx.fillStyle=el.pill||'#805faf';ctx.shadowBlur=3*factor;ctx.beginPath();ctx.roundRect(x-tw/2,y-(el.size*factor+28*factor)/2,tw,el.size*factor+28*factor,r);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=el.color;ctx.textAlign='center';ctx.fillText(target,x,y,tw-20*factor)}else{ctx.fillStyle=el.color;let anchor=el.align==='left'?x-maxWidth/2:el.align==='right'?x+maxWidth/2:x;for(let i=0;i<lines.length;i++)ctx.fillText(lines[i],anchor,startY+i*lineHeight,maxWidth)}ctx.restore()}
 return c;
}
async function v3Download(){try{let can=await v3ExportCanvas();let e=v3Event(),a=document.createElement('a');a.download=`Naitea-${e.title.replace(/[^a-z0-9àâéèêëîïôùûüç -]/gi,'').trim().replace(/\s+/g,'-')}-${v3.format}.png`;a.href=can.toDataURL('image/png');a.click();toast('Visuel PNG téléchargé ✨')}catch(e){console.error(e);toast('Impossible de créer le PNG')}}
async function v3Save(){if(v3Busy)return;v3Busy=true;try{let c=await v3ExportCanvas(true);let pr={title:v3.layers.find(x=>x.id==='title')?.text||v3Event().title,date:new Date().toLocaleDateString('fr-FR'),preview:c.toDataURL('image/jpeg',.73),data:JSON.stringify({eventId:v3.eventId,scene:v3.scene,mood:v3.mood,format:v3.format,goal:v3.goal,layers:v3.layers,customPhoto:v3.customPhoto,caption:v3.caption})};v3.projects.unshift(pr);v3.projects=v3.projects.slice(0,12);v3Store();render();toast('Création ajoutée à ta bibliothèque 🌷')}catch(e){console.error(e);toast('Impossible de sauvegarder le visuel')}finally{v3Busy=false}}
function v3Schedule(){let start=daysFromNow(1);showModal('Programmer ma communication 📅','Simulation : le contenu est enregistré dans le calendrier local, sans publication réelle.',`<form id="v3ScheduleForm"><div class="field"><label>Nom de la publication</label><input name="title" required value="${v3E(v3Event().title)} · ${v3E(v3Goals.find(x=>x[0]===v3.goal)?.[1]||'Atelier')}"></div><div class="field"><label>Réseaux à utiliser (démo)</label><div class="chipset"><label class="channel"><input type="checkbox" name="instagram" checked> Instagram professionnel</label><label class="channel"><input type="checkbox" name="facebook" checked> Page Facebook</label></div></div><div class="inputgrid"><div class="field"><label>Date</label><input type="date" name="date" min="${daysFromNow(0)}" value="${start}" required></div><div class="field"><label>Heure</label><input type="time" name="time" value="10:00" required></div></div><div class="field"><label>Légende à publier</label><textarea name="caption" rows="7">${v3E(v3.caption)}</textarea></div><p class="v3-schedulehint">⚠️ Aucun compte Meta n'est connecté et aucune publication n'est envoyée. Il s'agit uniquement de tester le parcours.</p><div class="modalfooter"><button type="button" class="btn secondary" data-action="close-modal">Annuler</button><button class="btn" type="submit">Ajouter au calendrier démo</button></div></form>`)}
async function v3ScheduleSave(form){let d=Object.fromEntries(new FormData(form));let channels=[...(d.instagram?['Instagram']:[]),...(d.facebook?['Facebook']:[])];if(!channels.length){toast('Sélectionne au moins un réseau');return}try{let c=await v3ExportCanvas(true);let preview=c.toDataURL('image/jpeg',.72);state.campaigns.unshift({id:uid(),date:d.date,time:d.time,title:d.title,channels,caption:d.caption,eventId:v3.eventId,status:'Programmé · démo',format:v3.format,style:'Studio V3',intent:v3.goal,visualTitle:v3.layers.find(x=>x.id==='title')?.text,preview});addlog('calendar',`Publication V3 programmée en démo : ${d.title}`);save();closeModal();navigate('publications');toast('Publication simulée ajoutée au calendrier 🌸')}catch(e){console.error(e);toast('Impossible de préparer cette publication')}}
function v3Compress(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith('image/'))return reject(Error('Utilise une image'));if(file.size>10e6)return reject(Error('Image trop volumineuse'));let reader=new FileReader();reader.onerror=()=>reject(Error('Lecture impossible'));reader.onload=()=>{let image=new Image();image.onload=()=>{let c=document.createElement('canvas');let scale=Math.min(1,1150/Math.max(image.width,image.height));c.width=Math.round(image.width*scale);c.height=Math.round(image.height*scale);c.getContext('2d').drawImage(image,0,0,c.width,c.height);resolve(c.toDataURL(file.type==='image/png'||file.type==='image/webp'?'image/png':'image/jpeg',.88))};image.onerror=()=>reject(Error('Fichier image invalide'));image.src=reader.result};reader.readAsDataURL(file)})}
function v3Action(k,val){if(k==='tab'){v3.tab=val;v3Rerender();return}if(k==='right'){v3.rightTab=val;v3Rerender();return}if(k==='scene'){v3SetScene(val);return}if(k==='variant'){v3Snapshot();v3.mood=+val;v3.customPhoto='';v3Rerender();return}if(k==='template'){v3ChangeGoal(val);return}if(k==='format'){v3Snapshot();v3.format=val;v3Rerender();return}if(k==='generate'){v3.customPhoto='';v3.tab='ia';v3Rerender();toast('4 illustrations de démonstration proposées ✨');return}if(k==='undo'){v3Undo();return}if(k==='redo'){v3Undo(true);return}if(k==='refresh'){v3Snapshot();v3.layers=v3LayersForGoal();v3.selected='title';v3Rerender();return}if(k==='clearphoto'){v3Snapshot();v3.customPhoto='';v3Rerender();return}if(k==='addtext'||k==='addpill'){v3Snapshot();let id=uid();v3.layers.push({id,kind:k==='addpill'?'pill':'text',text:k==='addpill'?'MON MESSAGE':'Votre texte ici',x:50,y:k==='addpill'?38:42,size:k==='addpill'?18:30,color:'#ffffff',weight:800,width:85,align:'center',font:'rounded',pill:state.brand.accent});v3.selected=id;v3.rightTab='elements';v3Rerender();return}if(k==='delete'){v3Snapshot();v3.layers=v3.layers.filter(l=>l.id!==v3.selected);v3.selected=v3.layers[0]?.id||'';v3Rerender();return}if(k==='duplicate'){let l=v3Layer();if(l){v3Snapshot();let id=uid();v3.layers.push({...l,id,x:Math.min(95,l.x+6),y:Math.min(95,l.y+6)});v3.selected=id;v3Rerender()}return}if(k==='regen-caption'){v3.caption=v3Caption();v3Rerender();toast('Nouvelle légende préparée ✨');return}if(k==='copy-caption'){copyText(v3.caption);return}if(k==='download'){v3Download();return}if(k==='save'){v3Save();return}if(k==='schedule'){v3Schedule();return}if(k==='load'){let p=v3.projects[+val];if(!p)return;v3Snapshot();try{let d=JSON.parse(p.data);Object.assign(v3,d);v3.selected='title';v3Rerender();toast('Création rechargée')}catch(e){toast('Projet inaccessible')}return}if(k==='deleteproject'){v3.projects.splice(+val,1);v3Rerender();toast('Création supprimée')} }

document.addEventListener('pointerdown',ev=>{let el=ev.target.closest('[data-layer]');if(!el||page!=='studioia')return;let stage=document.getElementById('v3Stage');if(!stage)return;let layer=v3.layers.find(x=>x.id===el.dataset.layer);if(!layer)return;v3.selected=layer.id;v3Snapshot();let r=stage.getBoundingClientRect();v3Pointer={id:layer.id,startX:ev.clientX,startY:ev.clientY,x:layer.x,y:layer.y,w:r.width,h:r.height};el.setPointerCapture?.(ev.pointerId);ev.preventDefault();stage.querySelectorAll('[data-layer]').forEach(n=>n.classList.toggle('selected',n.dataset.layer===layer.id));},true);

document.addEventListener('input',ev=>{let x=ev.target;if(page!=='studioia')return;if(x.id==='v3Caption'){v3.caption=x.value;v3Store();return}if(x.id==='v3LayerText'){if(v3Layer()){v3Layer().text=x.value;v3LayerSync();v3Store()}return}let key={v3Size:'size',v3Color:'color',v3Pill:'pill',v3Width:'width',v3X:'x',v3Y:'y'}[x.id];if(key&&v3Layer()){v3Layer()[key]=['size','width','x','y'].includes(key)?+x.value:x.value;v3LayerSync();if(x.id==='v3Size'){let l=document.getElementById('v3SizeLabel');if(l)l.textContent=x.value+'px'}v3Store();return}if(x.matches('[data-v3-brand]')){state.brand[x.dataset.v3Brand]=x.value;let sp=x.parentNode.querySelector('span');if(sp)sp.textContent=x.value;let brand=document.getElementById('v3BrandName');if(brand&&x.dataset.v3Brand==='name')brand.textContent=x.value;save()}},true);

const v5BaseHandleForm=handleForm;
handleForm=function(form){if(form.id==='editEvent'||form.id==='createEvent'){

 if(!d.title?.trim()||!d.place?.trim()||!d.date||+d.capacity<1||+d.price<0){toast('Vérifie les champs obligatoires');return}
 let e=old||{id:uid(),emoji:'🌷',color:'pink'};

 addlog('calendar',(old?'Atelier modifié : ':'Nouvel atelier : ')+e.title);save();closeModal();navigate('ateliers');toast(old?'Atelier modifié 🌸':'Atelier créé 🌸');return;
 }
 if(form.id==='bookEvent'){
 let d=Object.fromEntries(new FormData(form).entries());if(!d.firstName?.trim()||!d.lastName?.trim()||!d.phone?.trim()){toast('Renseigne le prénom, le nom et le téléphone');return}

 let fake=document.createElement('form');fake.id='bookEvent';for(let [k,v] of Object.entries(d)){if(k==='name')continue;let x=document.createElement('input');x.name=k;x.value=v;fake.append(x)}let x=document.createElement('input');x.name='name';x.value=d.firstName.trim()+' '+d.lastName.trim();fake.append(x);
 if(d.newsletter){let c=document.createElement('input');c.name='newsletter';c.value='on';fake.append(c)}
 v5BaseHandleForm(fake);let signup=state.signups.find(s=>s.eventId===e.id&&s.email===d.email.toLowerCase().trim());if(signup){Object.assign(signup,{firstName:d.firstName.trim(),lastName:d.lastName.trim(),phone:d.phone.trim(),coParent:!!d.hasCoParent,coParentName:d.hasCoParent?d.coParentFirst+' '+d.coParentLast:'',childPresent:!!d.childPresent,childName:d.childPresent?d.childName||'':'',childAge:d.childPresent?d.childAge||'':''});save()}return;
 }
 return v5BaseHandleForm(form)
};

ooter"><button type="button" class="btn secondary" data-action="close-modal">Annuler</button><button class="btn" type="submit">${waiting?'Rejoindre la liste d’attente':'Confirmer mon inscription'}</button></div></form>`)};

// Portable links contain only public workshop fields, never participant records.
function v8Pack(e) {
  const fields = [
    "id",
    "title",
    "category",
    "date",
    "time",
    "duration",
    "place",
    "capacity",
    "price",
    "description",
    "emoji",
    "color",
  ];
  let out = {};
  for (let k of fields) out[k] = e[k];
  if (e.cover?.startsWith("/assets/")) out.cover = e.cover;
  return btoa(
    String.fromCharCode(...new TextEncoder().encode(JSON.stringify(out))),
  )
    .replaceAll("+", "-")
    .replaceAll("/", "_")
    .replaceAll("=", "");
}
function v8SharedURL(e, embed = false) {
  let u = new URL("/", location.origin);
  u.searchParams.set(embed ? "embed" : "atelier", e.id);
  u.searchParams.set("event", v8Pack(e));
  return u.href;
}
v5EventURL = (e) => v8SharedURL(e);
v5EmbedURL = (e) => v8SharedURL(e, true);
function v8LoadShared() {
  const q = new URLSearchParams(location.search),
    packed = q.get("event");
  let id = q.get("atelier") || q.get("embed");
  if (!id && location.hash.startsWith("#atelier=")) {
    try {
      id = decodeURIComponent(location.hash.slice(8));
    } catch {}
  }
  if (!id) return;
  let error = "";
  if (packed) {
    try {
      if (packed.length > 16000) throw Error();
      let bytes = Uint8Array.from(
        atob(packed.replaceAll("-", "+").replaceAll("_", "/")),
        (c) => c.charCodeAt(0),
      );
      let e = JSON.parse(new TextDecoder().decode(bytes));
      if (
        e.id !== id ||
        typeof e.title !== "string" ||
        e.title.length > 160 ||
        !/^\d{4}-\d{2}-\d{2}$/.test(e.date) ||
        !/^([01]\d|2[0-3]):[0-5]\d$/.test(e.time) ||
        Number.isNaN(v8Date(e.date).getTime()) ||
        v8ISO(v8Date(e.date)) !== e.date ||
        !Number.isInteger(e.capacity) ||
        e.capacity < 1 ||
        e.capacity > 100 ||
        !Number.isFinite(e.price) ||
        e.price < 0
      )
        throw Error();
      let clean = {
        id: e.id,
        title: e.title,
        category: String(e.category || "Atelier").slice(0, 80),
        date: e.date,
        time: e.time,
        duration: String(e.duration || ""),
        place: String(e.place || "").slice(0, 180),
        capacity: e.capacity,
        price: e.price,
        description: String(e.description || "").slice(0, 3000),
        emoji: "🌷",
        color: "pink",
      };
      if (
        typeof e.cover === "string" &&
        /^\/assets\/photos\/[\w-]+\.jpg$/.test(e.cover)
      )
        clean.cover = e.cover;
      let old = state.events.findIndex((x) => x.id === id);
      if (old >= 0) state.events[old] = clean;
      else state.events.push(clean);
    } catch {
      error =
        "Ce lien est incomplet ou invalide. Demandez un nouveau lien à votre accompagnante.";
    }
  }
  return { id, embed: q.has("embed"), error };
}

// Calendar: shared view of workshops and individual appointments.
function v8Calendar() {
  let d = v8Date(v8CalDate),
    start,
    end,
    cells = [];
  if (v8CalView === "month") {
    start = new Date(d.getFullYear(), d.getMonth(), 1, 12);
    start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
    end = new Date(start);
    end.setDate(end.getDate() + 42);
  } else if (v8CalView === "week") {
    start = v8Date(v8CalDate);
    start.setDate(start.getDate() - ((start.getDay() + 6) % 7));
    end = new Date(start);
    end.setDate(end.getDate() + 7);
  } else {
    start = v8Date(v8CalDate);
    end = new Date(start);
    end.setDate(end.getDate() + 1);
  }
  for (let x = new Date(start); x < end; x.setDate(x.getDate() + 1)) {
    let date = v8ISO(x),
      items = [
        ...state.events
          .filter((e) => e.date === date)
          .map((e) => ({
            id: e.id,
            title: e.title,
            time: e.time,
            type: "workshop",
          })),
        ...state.v8.appointments
          .filter((a) => a.date === date && a.status === "confirmed")
          .map((a) => ({
            id: a.id,
            title: a.title,
            time: a.time,
            type: "appointment",
          })),
      ].sort((a, b) => a.time.localeCompare(b.time));
    cells.push(
      `<div class="v8-cal-day ${date === daysFromNow(0) ? "today" : ""} ${x.getMonth() !== d.getMonth() ? "outside" : ""}"><div class="v8-cal-date">${v8CalView !== "month" ? x.toLocaleDateString("fr-FR", { weekday: "short" }) : ""} ${x.getDate()}</div>${items.map((e) => `<button class="v8-cal-item ${e.type}" aria-label="${esc(e.time+' · '+e.title)}" title="${esc(e.title)}" data-v8="calendar-event" data-id="${esc(e.id)}" data-type="${e.type}"><strong>${esc(e.time)}</strong> ${esc(e.title)}</button>`).join("")}${!items.length && v8CalView === "day" ? '<p class="fine">Aucun événement ce jour.</p>' : ""}</div>`,
    );
  }
  return `<section class="v8-calendar card"><div class="v8-toolbar"><div><h2>Calendrier</h2></div><div class="v8-segments">${[
    ["month", "Mois"],
    ["week", "Semaine"],
    ["day", "Jour"],
  ]
    .map(([k, t]) =>
      v8Button(
        "calendar-view",
        t,
        `data-value="${k}" aria-pressed="${v8CalView === k}"`,
      ),
    )
    .join(
      "",
    )}</div></div><div class="v8-toolbar">${v8Button("calendar-prev", "←", 'aria-label="Période précédente"')}<strong>${d.toLocaleDateString("fr-FR", v8CalView === "month" ? { month: "long", year: "numeric" } : { day: "numeric", month: "long", year: "numeric" })}</strong>${v8Button("calendar-next", "→", 'aria-label="Période suivante"')}${v8Button("calendar-today", "Aujourd’hui")}<input aria-label="Choisir une date du calendrier" id="v8CalendarDate" type="date" value="${v8CalDate}"></div><p class="v8-calendar-mobile-hint">${v8CalView==='week'?'Faites glisser la semaine pour parcourir les jours.':'Touchez un horaire pour ouvrir le détail de la rencontre.'}</p><div class="v8-calendar-scroll"><div class="v8-cal-grid ${v8CalView}">${v8CalView === "month" ? ["Lun", "Mar", "Mer", "Jeu", "Ven", "Sam", "Dim"].map((t) => `<div class="v8-cal-weekday">${t}</div>`).join("") : ""}${cells.join("")}</div></div><p class="fine">Rose : ateliers · Sauge : rendez-vous individuels</p></section>`;

async function v8DesignCanvas() {
  await document.fonts.load("700 40px Lora");
  await document.fonts.load('400 30px "DM Sans"');
  let [w, h] = v8DesignSize(),
    can = document.createElement("canvas");
  can.width = w;
  can.height = h;
  let ctx = can.getContext("2d");
  ctx.fillStyle = v8Design.bg;
  ctx.fillRect(0, 0, w, h);
  let drawCover = (im, x, y, W, H) => {
    let r = Math.max(W / im.width, H / im.height);
    ctx.drawImage(
      im,
      x + (W - im.width * r) / 2,
      y + (H - im.height * r) / 2,
      im.width * r,
      im.height * r,
    );
  };
  if (v8Design.photo) {
    let im = await v3Img(v8Design.photo);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, h * 0.1, w, h * 0.34);
    ctx.clip();
    ctx.filter = `brightness(${v8Design.brightness}%) contrast(${v8Design.contrast}%)`;
    drawCover(im, 0, h * 0.1, w, h * 0.34);
    ctx.restore();
  }
  ctx.fillStyle = v8Design.accent;
  ctx.fillRect(w * 0.08, h * 0.445, w * 0.15, h * 0.006);
  if (v8Design.showLogo && state.brand.logo) {
    let im = await v3Img(state.brand.logo),
      W = w * 0.14,
      H = h * 0.07,
      r = Math.min(W / im.width, H / im.height);
    ctx.drawImage(im, w * 0.78, h * 0.02, im.width * r, im.height * r);
  }
  for (let l of v8Design.layers) {
    if (l.type === "image") {
      let im = await v3Img(l.src);
      ctx.drawImage(
        im,
        (w * l.x) / 100,
        (h * l.y) / 100,
        (w * l.w) / 100,
        (((w * l.w) / 100) * im.height) / im.width,
      );
      continue;
    }
    ctx.fillStyle = l.color;
    ctx.font = `${l.font === "Lora" ? 700 : 400} ${l.size}px "${l.font}"`;
    ctx.textBaseline = "top";
    let lines = v3Wrapped(ctx, l.text, (w * l.w) / 100);
    lines.forEach((line, i) =>
      ctx.fillText(line, (w * l.x) / 100, (h * l.y) / 100 + i * l.size * 1.35),
    );
  }
  return can;
}

async function v9Font(family, weight) {

    ? +weight
    : entry.weights.includes(400)
      ? 400
      : entry.weights[0];

  if (custom) {
    const key = "custom-" + family;
    if (!v9Fonts.has(key)) {
      const font = new FontFace(family, `url(${custom.data})`, {
        weight: "400",
      });
      v9Fonts.set(
        key,
        font.load().then((face) => document.fonts.add(face)),
      );
    }
    await v9Fonts.get(key);
    return 400;
  }
  if (
    (family === "Lora" && weight === 700) ||
    (family === "DM Sans" && [400, 500, 600, 700].includes(weight))
  ) {
    await document.fonts.load(`${weight} 24px "${family}"`);
    return weight;
  }
  const key = family + "-" + weight;
  if (!v9Fonts.has(key)) {
    const font = new FontFace(
      family,
      `url('/api/font?family=${encodeURIComponent(family)}&weight=${weight}')`,
      { weight: String(weight), style: "normal" },
    );
    v9Fonts.set(
      key,
      font
        .load()
        .then((loaded) => {
          document.fonts.add(loaded);
          return weight;
        })
        .catch((e) => {
          v9Fonts.delete(key);

    );
  }
  await v9Fonts.get(key);
  return weight;
}

const v11HandleBase = handleForm;

    const details = {};

    if (modes.includes("En visio")) details.video = { platform: value("videoPlatform"), other: value("videoOther") };
    if (modes.includes("En cabinet")) details.office = { address: value("officeAddress") };

// Prepare the media before the share click so transient user activation is kept.
const v11PreviewBase = v9Preview;
v9Preview = async function () {
  await v11PreviewBase();
  if (!v9Publication || !document.querySelector(".v9-publication-preview")) return;
  const publication = v9Publication;
  const buttons = [...document.querySelectorAll('[data-v9="share-social"]')]; buttons.forEach(b => b.disabled = true);
  try {
    const original = await v3Img(publication.image), ratio = original.width / original.height;
    const canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = v8Design.format === "story" ? 1920 : Math.round(1080 / Math.max(.8, Math.min(1.91, ratio)));
    const ctx = canvas.getContext("2d"); ctx.fillStyle = v8Design.bg || "#FFF7F1"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const scale = Math.min(canvas.width / original.width, canvas.height / original.height);
    ctx.drawImage(original, (canvas.width - original.width * scale) / 2, (canvas.height - original.height * scale) / 2, original.width * scale, original.height * scale);
    publication.shareBlob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", .95));
    publication.shareImage = canvas.toDataURL("image/jpeg", .95);
    publication.shareSize = `${canvas.width} × ${canvas.height}`;
    document.querySelector(".v9-publication-preview")?.insertAdjacentHTML("afterend", '<div class="v8-toolbar"><button type="button" class="btn secondary small" data-v11="copy-preview-caption">Copier le texte de la publication</button><span class="fine" id="v11PreviewCopyStatus" role="status">Sur mobile, colle la légende dans Instagram après le partage de la photo.</span></div>');
    document.querySelector(".v9-share-buttons")?.insertAdjacentHTML("beforebegin", `<p class="fine v11-share-format">Pour Instagram, un JPEG ${publication.shareSize} est préparé. La composition est conservée ; les marges et les zones transparentes reprennent le fond du document.</p>`);
  } catch { toast("Le JPEG de partage n’a pas pu être préparé. Réessaie l’aperçu."); }
  finally { buttons.forEach(b => b.disabled = !publication.shareBlob); }
};
async function v11NativeShare(channel) {
  const p = v9Publication;
  const file = new File([p.shareBlob], `Naitea-${channel}.jpg`, { type: "image/jpeg" });
  let supported = false;
  try { supported = !!navigator.share && !!navigator.canShare?.({ files: [file] }); } catch {}
  if (!supported) return false;
  try {
    await navigator.share(channel === "instagram" ? { files: [file] } : { files: [file], text: p.text, title: "Publication Naïtéa" });
    toast("Visuel transmis au menu de partage. Valide la publication dans l’application choisie.");
    return true;
  } catch (error) {
    if (error.name === "AbortError") return true;
    return false;
  }
}
v9ShareSocial = async function (channel) {
  if (!document.getElementById("v9ShareConfirmed")?.checked) return toast("Confirme la vérification du visuel et du texte.");
  if (!v9Publication?.shareBlob) return toast("Le visuel de partage est en cours de préparation.");
  v9Publication.text = document.getElementById("v9PublicationText").value;
  if (await v11NativeShare(channel)) return;
  const name = channel === "facebook" ? "Facebook" : "Instagram";
  v9Download(`Naitea-${channel}.jpg`, v9Publication.shareBlob, "image/jpeg");
  showModal("Publier sur " + name, "", `<div class="v11-social-ready"><img src="${v9Publication.shareImage}" alt="Visuel JPEG prêt pour ${name}"><div><h3>Ton visuel et ton texte sont prêts</h3><ol><li>Récupère le fichier <strong>Naitea-${channel}.jpg</strong> dans tes téléchargements.</li><li>Copie le texte ci-dessous.</li><li>Dans ${name}, choisis <strong>Créer${channel === "instagram" ? " puis Publication" : " une publication"}</strong>, importe le JPEG et colle le texte.</li></ol><p>Sur ordinateur, l’import du visuel et la validation finale se font dans ${name}.</p><div class="v8-toolbar"><button type="button" class="btn secondary" data-v11="download-social" data-channel="${channel}">Télécharger le visuel</button><a class="btn" href="https://www.${channel === "facebook" ? "facebook" : "instagram"}.com/" target="_blank" rel="noopener noreferrer">Ouvrir ${name}</a></div></div></div><label class="field"><span>Texte à publier</span><textarea id="v11SocialCaption" rows="7">${esc(v9Publication.text)}</textarea></label><button type="button" class="btn secondary" data-v11="copy-caption">Copier le texte</button><p id="v11ShareStatus" class="fine" role="status">Aucune publication automatique n’a été effectuée.</p>`);
  document.querySelector(".modal")?.classList.add("v11-social-modal");
};
document.addEventListener("click", async event => {
  const button = event.target.closest('[data-v11="download-social"],[data-v11="copy-caption"]'); if (!button) return;
  if (button.dataset.v11 === "download-social") return v9Download(`Naitea-${button.dataset.channel}.jpg`, v9Publication.shareBlob, "image/jpeg");

// La démo reste en localStorage : nous personnalisons uniquement le prénom.
// Les ateliers/réservations ne sont PAS encore synchronisés avec Supabase.
async function naiteaRefreshAccount(supabase) {
  const { data, error } = await supabase.auth.getUser();
  const user = error ? null : data?.user;
  let fullName = '';
  if (user) {
    const { data: profile, error: profileError } = await supabase
      .from('naitea_profiles')
      .select('full_name')
      .eq('id', user.id)
      .maybeSingle();
    if (!profileError && profile?.full_name) fullName = profile.full_name;
    if (!fullName) fullName = user.user_metadata?.full_name || '';
  }
  const firstName = String(fullName).trim().split(/\s+/)[0] || '';
  naiteaAuthName = firstName.slice(0, 60);
  naiteaAuthEmail = user?.email || '';
  const accountLink = document.querySelector('.naitea-login-link');
  if (accountLink) accountLink.textContent = user ? 'Mon compte' : 'Se connecter';
  const avatar = document.querySelector('.topbar .avatar');
  if (avatar) avatar.textContent = naiteaAuthName ? naiteaAuthName.charAt(0).toLocaleUpperCase('fr') : '♡';
  if (mode === 'pro' && page === 'dashboard') render();
}
async function naiteaLoadAuth() {
  try {
    const response = await fetch('/api/public-config', { cache: 'no-store' });
    if (!response.ok) return;
    const config = await response.json();
    if (!config.url || !config.publishableKey) return;
    const sdk = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    const supabase = sdk.createClient(config.url, config.publishableKey);
    await naiteaRefreshAccount(supabase);
    supabase.auth.onAuthStateChange(() => {
      setTimeout(() => { naiteaRefreshAccount(supabase).catch(() => {}); }, 0);
    });
  } catch (error) {
    console.warn('Naïtéa : identification indisponible en mode démo.');
  }
}
naiteaLoadAuth();
})();
